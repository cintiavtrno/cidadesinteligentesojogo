<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDADE ONLINE — Rastreamento Urbano</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020617; --surface:#0f172a; --surface2:#1e293b;
  --border:rgba(56,189,248,.2); --text:#94a3b8;
  --text-bright:#f8fafc; --text-dim:#475569;
  --cyan:#38bdf8; --teal:#2dd4bf; --red:#f43f5e; --alert:#fbbf24;
  --char-col:#38bdf8;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.6;overflow:hidden;user-select:none;}

/* ── UI SCREENS ── */
#ui-layer{position:absolute;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;transition:background 0.3s;}
#ui-layer.in-game{background:rgba(2,6,23,0.9);backdrop-filter:blur(8px);}
#ui-layer.hidden{display:none;}

.screen{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;animation:bootUp .4s cubic-bezier(0,0.6,0.3,1)}
.screen-left{align-items:flex-start;justify-content:center;padding-top:4rem;padding-bottom:4rem;}
@keyframes bootUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.display{font-family:'Inter',sans-serif;font-weight:700;line-height:1.1;letter-spacing:-0.03em;}
.label{font-size:.6rem;text-transform:uppercase;letter-spacing:.25em;color:var(--text-dim);}
.status-indicator{display:inline-flex;align-items:center;gap:.5rem;font-size:.65rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.15em;border:1px solid var(--border);padding:.4rem 1rem;background:rgba(15,23,42,0.8);position:absolute;top:2rem;left:2rem;z-index:30;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.btn{display:inline-block;padding:.8rem 1.5rem;border:1px solid var(--char-col);color:var(--char-col);background:rgba(15,23,42,0.8);font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.1em;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn:hover{background:var(--char-col);color:var(--bg);box-shadow:0 0 15px rgba(56,189,248,.3);}
.btn-ghost{border-color:var(--text-dim);color:var(--text);}
.btn-ghost:hover{border-color:var(--text-bright);color:var(--text-bright);background:var(--surface2);box-shadow:none;}

.panel{background:rgba(15,23,42,0.9);border:1px solid var(--border);padding:2rem;position:relative;width:100%;max-width:740px;}
.panel::before{content:'';position:absolute;top:0;left:0;width:20px;height:20px;border-top:2px solid var(--char-col);border-left:2px solid var(--char-col);}
.panel::after{content:'';position:absolute;bottom:0;right:0;width:20px;height:20px;border-bottom:2px solid var(--char-col);border-right:2px solid var(--char-col);}

.choices{display:flex;flex-direction:column;gap:.75rem;width:100%;margin-top:2rem;}
.choice-btn{border:1px solid var(--border);background:rgba(15,23,42,0.6);padding:1.2rem;text-align:left;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;line-height:1.6;position:relative;overflow:hidden;}
.choice-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--char-col);transform:scaleY(0);transition:transform .2s;transform-origin:bottom;}
.choice-btn:hover{background:rgba(30,41,59,0.8);color:var(--text-bright);border-color:var(--text-dim);}
.choice-btn:hover::before{transform:scaleY(1);}
.choice-letter{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--char-col);margin-bottom:.4rem;letter-spacing:.1em;}

/* ── CONSEQUENCE STYLES ── */
.consequence-box{border:1px solid var(--char-col); background:rgba(15,23,42,0.8); padding:1.4rem; margin:1.4rem 0; width:100%;}
.consequence-label{font-size:.6rem; text-transform:uppercase; letter-spacing:.15em; color:var(--char-col); margin-bottom:.75rem;}
.consequence-text{font-size:.87rem; line-height:1.9; color:var(--text-bright);}
.reveal-box{border:1px solid rgba(245,158,11,.3); background:rgba(245,158,11,.05); padding:1.2rem; font-size:.8rem; line-height:1.8; color:var(--alert); font-style:italic;}
.reveal-label{font-size:.58rem; text-transform:uppercase; letter-spacing:.15em; color:var(--alert); margin-bottom:.5rem;}
.manchetes{display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-top:1.5rem;}
.manchete{padding:1rem; border:1px solid rgba(148,163,184,.2); background:rgba(15,23,42,0.5); font-size:.75rem; line-height:1.7;}
.manchete-label{font-size:.55rem; text-transform:uppercase; letter-spacing:.18em; margin-bottom:.45rem; opacity:.7;}
.manchete-mainstream .manchete-label{color:var(--text-dim);}
.manchete-alt{border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.05); color:#fca5a5;}
.manchete-alt .manchete-label{color:var(--red);}

/* ── GAME CANVAS ── */
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;background:#020617;cursor:crosshair;}
#hud{position:absolute;top:2rem;left:50%;transform:translateX(-50%);z-index:10;display:none;background:rgba(15,23,42,0.9);border:1px solid var(--char-col);padding:1rem 2rem;text-align:center;color:var(--text-bright);font-family:'Space Mono';font-size:.8rem;letter-spacing:.1em;box-shadow:0 0 20px rgba(0,0,0,0.8);animation:bootUp 0.3s;}
#controls-hint{position:absolute;bottom:2rem;right:2rem;z-index:10;display:none;text-align:right;font-size:.65rem;color:var(--text-dim);line-height:1.8;background:rgba(2,6,23,0.6);padding:1rem;border:1px solid var(--border);backdrop-filter:blur(4px);}
.glitch-anim{animation:glitch .3s cubic-bezier(.25,.46,.45,.94) both;}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-3px, 3px);filter:hue-rotate(-90deg)}40%{transform:translate(-3px, -3px)}60%{transform:translate(3px, 3px);filter:hue-rotate(90deg)}80%{transform:translate(3px, -3px)}100%{transform:translate(0);filter:none}}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="hud">SISTEMA ATIVO: NAVEGUE ATÉ O ALVO PISCANTE NO MAPA</div>
<div id="controls-hint">NAVEGAÇÃO DO AVATAR<br><span style="color:var(--cyan)">CLIQUE NO MAPA</span> : IR ATÉ O LOCAL<br><span style="color:var(--cyan)">WASD/SETAS</span> : MOVER<br><span style="color:var(--cyan)">SHIFT</span> : VEÍCULO</div>

<div id="ui-layer">
  <div id="app"></div>
</div>

<script>
// ════════════════════════════════════════
// CITY STATE (SISTEMA DE SAVE SEGURO)
// ════════════════════════════════════════
const CK='cidadeOnline_rpg_definitivo';
function freshCity(){return{cameras:5,transparency:5,equity:5,playedChars:[]};}
function loadCity(){
  try{
    let c = JSON.parse(localStorage.getItem(CK));
    if(!c || typeof c.cameras !== 'number' || isNaN(c.cameras)) return freshCity();
    return c;
  } catch(e) { return freshCity(); }
}
function saveCity(c){try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}}
let CITY=loadCity();

function applyImpact(imp){
  if(!imp) return;
  if(imp.cameras !== undefined) CITY.cameras = Math.max(1, Math.min(10, CITY.cameras + imp.cameras));
  if(imp.transparency !== undefined) CITY.transparency = Math.max(1, Math.min(10, CITY.transparency + imp.transparency));
  if(imp.equity !== undefined) CITY.equity = Math.max(1, Math.min(10, CITY.equity + imp.equity));
  saveCity(CITY);
}

// ════════════════════════════════════════
// NARRATIVE ENGINE (A ÁRVORE DINÂMICA)
// ════════════════════════════════════════
const CHARS={
marco:{id:'marco',name:'Marco Santos',role:'SEC. ADJUNTO DE INOVAÇÃO',color:'#38bdf8',
  nodes:[
    { x:350, y:800, label:'Centro Histórico', title:'PALÁCIO THOMÉ DE SOUZA',

      getDecisions: (c) => [{q:'O contrato exige exclusividade sobre os dados urbanos.',choices:[
        {text:'Assinar diretriz padrão. A cidade precisa de luz rápida.', ef:2, eq:0, pr:-3, impact:{cameras:2, transparency:-1},
         consequence:'Contrato assinado. A luz chega em 8 meses; as câmeras, em 4. Em 2019, vaza que padrões de movimento de bairros periféricos foram vendidos para seguradoras. A prefeitura não tem poder de auditoria.',
         reveal:'Quando a IBM for adquirida por um consórcio estrangeiro, os dados migram de país. O município não é sequer notificado.',
         hl:{main:'"Salvador terá 100% de iluminação LED", anuncia prefeito', alt:'Contrato de 20 anos entrega dados de civis a empresa estrangeira'}
        },
        {text:'Negociar acesso compartilhado (Meio-termo).', ef:0, eq:0, pr:-1, impact:{cameras:1},
         consequence:'A IBM cede parcialmente. A prefeitura ganha um portal de acesso aos relatórios visuais. Mas a IBM continua sendo a dona legal do código-fonte e dos metadados para treinar suas IAs pelo mundo.',
         reveal:'Você ganhou um dashboard bonito, mas perdeu a caixa preta. Eles controlam a lógica do algoritmo.',
         hl:{main:'Prefeitura anuncia dashboard de controle de tráfego inteligente', alt:'Município aceita acesso parcial e mantém algoritmo em segredo'}
        },
        {text:'Exigir propriedade exclusiva do município sobre os dados.', ef:-2, eq:1, pr:2, impact:{transparency:2},
         consequence:'A IBM recusa as condições. O projeto atrasa 8 meses por impasse jurídico. O município adota um software mais barato e instável, mas a soberania legal dos dados brutos fica em casa.',

    { x:480, y:550, label:'Iguatemi', title:'CENTRO DE OPERAÇÕES',

        if(c[0] === 1) return `Você tem acesso compartilhado. Analisando os dashboards do carnaval, você nota que o sistema errou 96% das vezes, mirando em jovens negros. Você tem a prova na mão, mas o contrato proíbe vazamentos unilaterais.`;
        return `Você brigou pelos dados no Ponto 1. O software open-source mais barato também apresentou viés no carnaval (90% de erro racial). A falha é técnica, mas pelo menos você tem o código-fonte aberto para provar onde está o viés.`;
      },
      getDecisions: (c) => [{q:'O relatório comprova o viés racial do sistema.',choices:[
        {text:'Suprimir acesso. Instaurar revisão interna sigilosa.', ef:1, eq:-2, pr:-2, impact:{equity:-1},
         consequence:'O PDF é enterrado. Em 2021, a falha inalterada gera prisões injustas. Quando o caso estoura na mídia, o relatório que você escondeu é descoberto por hackers e vaza.',

        },
        {text:'Encaminhar à equipe técnica pedindo "patch" silencioso.', ef:0, eq:-1, pr:-1, impact:{},
         consequence:'A empresa envia uma atualização de firmware remota. Nenhuma auditoria verifica o que mudou de fato. O relatório original vai para a gaveta.',
         reveal:'A burocracia é a ferramenta mais eficiente para fazer problemas desaparecerem sem precisarem ser resolvidos.',
         hl:{main:'Empresa atualiza firmware de câmeras após pedido', alt:'Atualização invisível: viés racial pode continuar ativo sob novo código'}
        },
        {text:'Tornar público e suspender o reconhecimento facial.', ef:-2, eq:2, pr:2, impact:{cameras:-1, equity:1},
         consequence:'Terremoto político. A empresa ameaça processar. O relatório vira referência nacional e o Ministério Público barra sistemas similares. O prefeito exonera você oito meses depois.',
         reveal:'Você perdeu o emprego. O sistema foi auditado. O impacto real quase sempre cobra a cabeça de quem age.',
         hl:{main:'Secretário é demitido após vazar falhas em sistema municipal', alt:'Relatório de viés racial barra expansão de câmeras na capital'}
        }
      ]}]
    },
    { x:750, y:400, label:'Cajazeiras', title:'ESCOLA MUNICIPAL',
      getContext: (c) => {
        let txt = `O prefeito quer assinar um aditivo para instalar catracas com reconhecimento facial em 47 escolas da periferia. `;
        if(c[1] === 2) txt += `Como você suspendeu o sistema no Ponto 2, o prefeito está furioso. Ele diz que nas escolas "a segurança dos alunos contra invasores" justifica o uso da IA.`;
        else txt += `Como você abafou o problema no Ponto 2, o prefeito acredita que a tecnologia é infalível e quer expandir a biometria para 14.000 crianças.`;
        return txt;
      },
      getDecisions: (c) => [{q:'Aprovação da biometria infantil na rede pública.',choices:[
        {text:'Aprovar. Aumenta o controle de presença e verba.', ef:2, eq:-2, pr:-3, impact:{cameras:1, equity:-1},
         consequence:'O sistema é instalado. O viés racial é transferido para a infância: catracas travam erroneamente para alunos negros 4x mais. Os dados ficam no servidor corporativo.',
         reveal:'Você colocou o rosto e a geolocalização de 14.000 crianças sob controle privado em troca de planilhas de assiduidade.',
         hl:{main:'Presença escolar aumenta com catracas inteligentes', alt:'Catracas biométricas barram crianças negras com "falsos positivos"'}
        },
        {text:'Propor substituição por cartões com chip (RFID).', ef:0, eq:1, pr:1, impact:{},
         consequence:'O sistema é implantado sem coletar biometria. Os cartões são perdidos frequentemente, gerando atrito de reposição, mas os rostos estão a salvo.',
         reveal:'Uma solução analógica muitas vezes protege a privacidade melhor que a promessa da hiper-tecnologia.',
         hl:{main:'Escolas implementam acesso eletrônico por cartões', alt:'Veto à biometria infantil preserva dados de estudantes da rede'}
        },
        {text:'Bloquear tudo e barrar hardware privado nas escolas.', ef:-1, eq:2, pr:2, impact:{transparency:1},
         consequence:'A empresa faz lobby forte. O prefeito tenta derrubar seu veto. O desgaste interno isola você na secretaria, mas sua assinatura técnica impede o projeto legalmente.',
         reveal:'Às vezes a resistência não constrói nada de novo, ela apenas segura a porta contra o abismo.',
         hl:{main:'Burocracia atrasa projeto de modernização escolar', alt:'Secretário barra captura biométrica de menores no subúrbio'}
        }
      ]}]
    }
  ]
},
amara:{id:'amara',name:'Amara Silva',role:'PESQUISADORA UFBA',color:'#fbbf24',
  nodes:[
    { x:300, y:650, label:'Campus Ondina', title:'LABORATÓRIO DE DADOS',

// ════════════════════════════════════════
// GAME ENGINE CANVAS CORE
// ════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');
const hud = document.getElementById('hud');
const hints = document.getElementById('controls-hint');
const appUI = document.getElementById('app');

let S={screen:'splash', char:null, nodeIdx:0, scores:{ef:5,eq:5,pr:5}, choices:[]};
let GAME_ACTIVE = false;

const MAP_W = 1000, MAP_H = 1000;
let player = { x: 500, y: 500, vx: 0, vy: 0, speed: 3.5, vehicle: false };
let targetPos = null;
const keys = {};

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { 
  keys[e.key.toLowerCase()] = false; 
  if(e.key.toLowerCase() === 'shift' && GAME_ACTIVE && S.screen === 'map') {
    player.vehicle = !player.vehicle;
    player.speed = player.vehicle ? 7 : 3.5;
  }
});

// Suporte para Mouse/Touch - Point and Click
function handlePointerDown(e) {
  if(!GAME_ACTIVE || !S.char) return;
  const scale = Math.min(canvas.width/600, canvas.height/600);
  let cx, cy;
  if(e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  
  const mx = cx - canvas.width/2;
  const my = cy - canvas.height/2;
  targetPos = { x: mx/scale + player.x, y: my/scale + player.y };
}
canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('touchstart', handlePointerDown, {passive: false});

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function checkInteraction() {
  if(!GAME_ACTIVE || !S.char) return;
  const c = CHARS[S.char];
  
  if(S.nodeIdx >= c.nodes.length) {
    if(dist(player, {x: 500, y: 150}) < 45) { // Exit point
      S.screen = 'charSelect';
      if(!CITY.playedChars.includes(S.char)){ CITY.playedChars.push(S.char); saveCity(CITY); }
      GAME_ACTIVE = false; targetPos = null; renderUI();
    }
    return;
  }
  
  const node = c.nodes[S.nodeIdx];
  if(dist(player, node) < 35) {
    S.screen = 'node'; GAME_ACTIVE = false; targetPos = null; renderUI();
  }
}

function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

function updatePhysics() {
  if(!GAME_ACTIVE) return;
  
  let movingWithKeys = false;
  player.vx = 0; player.vy = 0;
  
  if(keys['arrowup'] || keys['w']) { player.vy = -player.speed; movingWithKeys = true; }
  if(keys['arrowdown'] || keys['s']) { player.vy = player.speed; movingWithKeys = true; }
  if(keys['arrowleft'] || keys['a']) { player.vx = -player.speed; movingWithKeys = true; }
  if(keys['arrowright'] || keys['d']) { player.vx = player.speed; movingWithKeys = true; }
  
  if(movingWithKeys) {
    targetPos = null;
    if(player.vx !== 0 && player.vy !== 0) { player.vx *= 0.707; player.vy *= 0.707; }
  } else if (targetPos) {
    const dx = targetPos.x - player.x;
    const dy = targetPos.y - player.y;
    const d = Math.hypot(dx, dy);
    if(d > player.speed) {
      player.vx = (dx/d) * player.speed;
      player.vy = (dy/d) * player.speed;
    } else {
      player.x = targetPos.x;
      player.y = targetPos.y;
      targetPos = null;
    }
  }

  player.x = Math.max(20, Math.min(MAP_W-20, player.x + player.vx));
  player.y = Math.max(20, Math.min(MAP_H-20, player.y + player.vy));
}

const cityBlocks = [];
for(let i=0; i<45; i++) cityBlocks.push({x: 50 + Math.random()*850, y: 50 + Math.random()*850, w: 40 + Math.random()*120, h: 40 + Math.random()*120});

function drawGame() {
  ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if(!GAME_ACTIVE && S.screen !== 'map') return;

  const scale = Math.min(canvas.width/600, canvas.height/600);
  ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(scale, scale); ctx.translate(-player.x, -player.y);

  // Roads
  ctx.strokeStyle = 'rgba(56,189,248,0.06)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for(let i=0; i<=MAP_W; i+=100) { ctx.moveTo(i,0); ctx.lineTo(i,MAP_H); }
  for(let j=0; j<=MAP_H; j+=100) { ctx.moveTo(0,j); ctx.lineTo(MAP_W,j); }
  ctx.stroke();

  // Buildings
  ctx.fillStyle = '#08101a'; ctx.strokeStyle = '#0f172a';
  cityBlocks.forEach(b => { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); });

  // Ponto de Destino do Mouse
  if(targetPos && GAME_ACTIVE) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(targetPos.x, targetPos.y, 8, 0, Math.PI*2); ctx.stroke();
  }

  if(S.char) {
    const c = CHARS[S.char]; 
    
    // Trail
    if(S.nodeIdx > 0) {
       ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.setLineDash([5, 5]); ctx.beginPath();
       ctx.moveTo(c.nodes[0].x, c.nodes[0].y);
       for(let i=1; i<S.nodeIdx; i++) ctx.lineTo(c.nodes[i].x, c.nodes[i].y);
       ctx.stroke(); ctx.setLineDash([]);
    }

    // Nodes
    c.nodes.forEach((n, idx) => {
      if(idx < S.nodeIdx) {
        ctx.fillStyle = '#1e293b'; ctx.strokeStyle = c.color;
        ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      } else if (idx === S.nodeIdx) {
        ctx.fillStyle = c.color; ctx.shadowColor = c.color; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(n.x, n.y, 12 + Math.sin(Date.now()/200)*3, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle='#fff'; ctx.font='bold 14px Space Mono'; ctx.fillText(n.label, n.x+20, n.y+4);
      } else {
        ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#475569';
        ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
    });

    // Saída
    if(S.nodeIdx >= c.nodes.length) {
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(500, 150, 15, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Space Mono'; ctx.fillText('SAÍDA DA SIMULAÇÃO (EXTRAÇÃO)', 525, 155);
    }
  }

  // Player
  ctx.translate(player.x, player.y);
  const angle = Math.atan2(player.vy, player.vx);
  if(player.vx!==0 || player.vy!==0) ctx.rotate(angle);
  
  ctx.fillStyle = S.char ? CHARS[S.char].color : '#f8fafc';
  ctx.beginPath();
  if(player.vehicle) {
    ctx.rect(-12, -7, 24, 14);
  } else {
    ctx.moveTo(10, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8);
  }
  ctx.fill(); ctx.restore();
}

function loop() { 
  updatePhysics(); 
  checkInteraction(); // Gatilho Automático
  drawGame(); 
  requestAnimationFrame(loop); 
}
requestAnimationFrame(loop);

// ════════════════════════════════════════
// RENDERIZAÇÃO DA INTERFACE (MÉTODOS SEGUROS)
// ════════════════════════════════════════
function renderUI(){
  document.documentElement.style.setProperty('--char-col', S.char ? CHARS[S.char].color : '#38bdf8');
  
  if(S.screen === 'map') {
    uiLayer.className = 'hidden'; hints.style.display = 'block';
    GAME_ACTIVE = true; hud.style.display = 'block';
    hud.innerHTML = S.nodeIdx >= CHARS[S.char].nodes.length ? "SISTEMA CONCLUÍDO: NAVEGUE ATÉ A SAÍDA (PONTO AMARELO)" : "ALVO DETECTADO: NAVEGUE ATÉ O PONTO PISCANTE NO MAPA";
  } else {
    uiLayer.className = 'in-game'; hints.style.display = 'none'; hud.style.display = 'none';
    const scr = {splash: renderSplash, charSelect: renderCharSelect, node: renderNode, consequence: renderConsequence, grandFinale: renderGrandFinale};
    
    // Sistema anti-crash e blindagem de tela branca
    try {
      appUI.innerHTML = (scr[S.screen])(); 
      uiLayer.scrollTop = 0;
    } catch(e) {
      console.error(e);
      appUI.innerHTML = `<div class="screen"><div class="display" style="color:var(--red);">DADOS CORROMPIDOS NA MEMÓRIA LOCAL.</div><br><button class="btn" data-a="resetAll">LIMPAR CACHE E REINICIAR</button></div>`;
    }
  }
}

appUI.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  
  if(a==='charSelect'){ S.screen='charSelect'; renderUI(); return; }
  
  if(a==='startRun'){ 
    S = {screen:'map', char:el.dataset.char, nodeIdx:0, scores:{ef:5,eq:5,pr:5}, choices:[]};
    player = { x: 500, y: 900, vx: 0, vy: 0, speed: 3.5, vehicle: false }; targetPos = null;
    renderUI(); return; 
  }
  
  if(a==='choose'){
    try {
      const idx = parseInt(el.dataset.idx);
      const node = CHARS[S.char].nodes[S.nodeIdx];
      const ch = node.getDecisions(S.choices)[0].choices[idx];
      
      S.scores.ef += (ch.ef||0); 
      S.scores.eq += (ch.eq||0); 
      S.scores.pr += (ch.pr||0);
      S.choices.push(idx); 
      applyImpact(ch.impact);
      
      S.screen='consequence'; 
      renderUI(); 
    } catch(err) {
      console.error(err);
      alert("Falha na memória do navegador. Por favor, clique em Reiniciar Sistema.");
    }
    return;
  }
  
  if(a==='returnMap'){ S.nodeIdx++; S.screen='map'; targetPos = null; renderUI(); return; }
  if(a==='resetAll'){ resetCity(); CITY=loadCity(); S.screen='splash'; renderUI(); return; }
});

renderUI();
</script>
</body>
</html>
