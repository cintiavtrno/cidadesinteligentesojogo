<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDADE ONLINE — Sistema de Rastreamento Urbano</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020617; --surface:#0f172a; --surface2:#1e293b;
  --border:rgba(56,189,248,.2); --text:#94a3b8;
  --text-bright:#f8fafc; --text-dim:#475569;
  --cyan:#38bdf8; --teal:#2dd4bf; --red:#f43f5e; --alert:#fbbf24;
  --char-col:#38bdf8;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.6;overflow:hidden;user-select:none;}

/* ── UI SCREENS ── */
#ui-layer{position:absolute;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;transition:background 0.3s;}
#ui-layer.in-game{background:rgba(2,6,23,0.85);backdrop-filter:blur(8px);}
#ui-layer.hidden{display:none;}

.screen{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;animation:bootUp .4s cubic-bezier(0,0.6,0.3,1)}
.screen-left{align-items:flex-start;justify-content:center;}
@keyframes bootUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.display{font-family:'Inter',sans-serif;font-weight:700;line-height:1.1;letter-spacing:-0.03em;}
.label{font-size:.6rem;text-transform:uppercase;letter-spacing:.25em;color:var(--text-dim);}
.status-indicator{display:inline-flex;align-items:center;gap:.5rem;font-size:.65rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.15em;border:1px solid var(--border);padding:.4rem 1rem;background:rgba(15,23,42,0.8);position:absolute;top:2rem;left:2rem;z-index:30;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.btn{display:inline-block;padding:.8rem 1.5rem;border:1px solid var(--char-col);color:var(--char-col);background:rgba(15,23,42,0.8);font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.1em;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn:hover{background:var(--char-col);color:var(--bg);box-shadow:0 0 15px rgba(56,189,248,.3);}
.btn-ghost{border-color:var(--text-dim);color:var(--text);}
.btn-ghost:hover{border-color:var(--text-bright);color:var(--text-bright);background:var(--surface2);box-shadow:none;}

.panel{background:rgba(15,23,42,0.9);border:1px solid var(--border);padding:2rem;position:relative;}
.panel::before{content:'';position:absolute;top:0;left:0;width:20px;height:20px;border-top:2px solid var(--char-col);border-left:2px solid var(--char-col);}
.panel::after{content:'';position:absolute;bottom:0;right:0;width:20px;height:20px;border-bottom:2px solid var(--char-col);border-right:2px solid var(--char-col);}

.choices{display:flex;flex-direction:column;gap:.75rem;width:100%;margin-top:2rem;}
.choice-btn{border:1px solid var(--border);background:rgba(15,23,42,0.6);padding:1.2rem;text-align:left;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;line-height:1.6;position:relative;overflow:hidden;}
.choice-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--char-col);transform:scaleY(0);transition:transform .2s;transform-origin:bottom;}
.choice-btn:hover{background:rgba(30,41,59,0.8);color:var(--text-bright);border-color:var(--text-dim);}
.choice-btn:hover::before{transform:scaleY(1);}
.choice-letter{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--char-col);margin-bottom:.4rem;letter-spacing:.1em;}

/* ── GAME CANVAS ── */
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;background:#020617;}
#hud{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:10;display:none;background:rgba(15,23,42,0.9);border:1px solid var(--char-col);padding:1rem 2rem;text-align:center;color:var(--text-bright);font-family:'Space Mono';font-size:.8rem;letter-spacing:.1em;box-shadow:0 0 20px rgba(0,0,0,0.8);animation:bootUp 0.3s;}
#controls-hint{position:absolute;bottom:2rem;right:2rem;z-index:10;display:none;text-align:right;font-size:.65rem;color:var(--text-dim);line-height:1.8;background:rgba(2,6,23,0.5);padding:1rem;border:1px solid var(--border);}
.glitch-anim{animation:glitch .3s cubic-bezier(.25,.46,.45,.94) both;}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-3px, 3px);filter:hue-rotate(-90deg)}40%{transform:translate(-3px, -3px)}60%{transform:translate(3px, 3px);filter:hue-rotate(90deg)}80%{transform:translate(3px, -3px)}100%{transform:translate(0);filter:none}}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="hud">VOCÊ CHEGOU. PRESSIONE [ ESPAÇO ] PARA INTERAGIR</div>
<div id="controls-hint">NAVEGAÇÃO DO AVATAR<br><span style="color:var(--cyan)">WASD / SETAS</span> : MOVER<br><span style="color:var(--cyan)">SHIFT</span> : ENTRAR/SAIR DO VEÍCULO</div>

<div id="ui-layer">
  <div id="app"></div>
</div>

<script>
// ════════════════════════════════════════
// CITY STATE
// ════════════════════════════════════════
const CK='cidadeOnline_rpg_v3';
function freshCity(){return{cameras:5,transparency:5,equity:5,playedChars:[]};}
function loadCity(){try{return JSON.parse(localStorage.getItem(CK))||freshCity();}catch{return freshCity();}}
function saveCity(c){try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){}}
let CITY=loadCity();

// ════════════════════════════════════════
// GAME DATA & BRANCHING PATHS
// ════════════════════════════════════════
const CHARS={
marco:{id:'marco',name:'Marco Santos',role:'SEC. ADJUNTO DE INOVAÇÃO',color:'#38bdf8',quote:'"A tecnologia resolve o que a política trava."',
  nodes:[
    { x:350, y:800, label:'Centro Histórico', title:'PALÁCIO THOMÉ DE SOUZA',
      getContext: (c) => `Sobre a mesa: a proposta da IBM para modernizar a iluminação pública. A cidade tem 40% das lâmpadas queimadas. A IBM promete instalar LEDs, mas exige que os sensores embutidos coletem dados de áudio e movimento.\nEles exigem ser os donos exclusivos desses dados por 20 anos.`,
      getDecisions: (c) => [{q:'Como negociar os dados urbanos?',choices:[
        {text:'Assinar diretriz padrão. A cidade precisa de luz.', ef:2, eq:0, pr:-3},
        {text:'Negociar "acesso compartilhado" (Meio-termo).', ef:0, eq:0, pr:-1},
        {text:'Exigir propriedade exclusiva do município sobre os dados.', ef:-2, eq:1, pr:2}
      ]}]
    },
    { x:480, y:550, label:'Iguatemi', title:'CENTRO DE OPERAÇÕES',
      getContext: (c) => {
        if(c[0] === 0) return `Você cedeu os dados no Ponto 1. Agora, no carnaval, o sistema IBM disparou 903 alertas. 96% eram falsos positivos, quase todos em negros. A IBM diz que é "comportamento proprietário" e não deixa você auditar o código.`;
        if(c[0] === 1) return `Você tem acesso compartilhado aos dados. Analisando os relatórios do carnaval, o sistema errou 96% das vezes, mirando em pessoas negras. Você tem a prova na mão, mas o contrato proíbe vazamentos.`;
        return `Você brigou pelos dados no Ponto 1. O projeto atrasou, a prefeitura usou um software mais barato e *open-source*. Ele também apresentou viés no carnaval (90% de erro racial), mas você tem o código-fonte aberto para provar a falha técnica.`;
      },
      getDecisions: (c) => [{q:'O que fazer com o relatório de viés racial?',choices:[
        {text:'Suprimir acesso. Instaurar revisão interna sigilosa.', ef:1, eq:-2, pr:-2},
        {text:'Encaminhar à equipe técnica pedindo um "patch" silencioso.', ef:0, eq:-1, pr:-1},
        {text:'Tornar público e suspender o reconhecimento facial.', ef:-2, eq:2, pr:2}
      ]}]
    },
    { x:750, y:400, label:'Cajazeiras', title:'ESCOLA MUNICIPAL',
      getContext: (c) => {
        let txt = `O prefeito quer instalar catracas com reconhecimento facial em 47 escolas da periferia. `;
        if(c[1] === 2) txt += `Como você suspendeu o sistema no Ponto 2, o prefeito está furioso e diz que nas escolas "a segurança dos alunos" justifica ignorar o viés.`;
        else txt += `Como você abafou o problema no Ponto 2, o prefeito acha que o sistema é perfeito e quer expandir para 14.000 crianças.`;
        return txt;
      },
      getDecisions: (c) => [{q:'Aprovação do aditivo de biometria infantil.',choices:[
        {text:'Aprovar. Aumenta o controle de presença.', ef:2, eq:-2, pr:-3},
        {text:'Propor substituição por cartões com chip (RFID).', ef:0, eq:1, pr:1},
        {text:'Bloquear o aditivo e barrar biometria nas escolas.', ef:-1, eq:2, pr:2}
      ]}]
    }
  ]
},
amara:{id:'amara',name:'Amara Silva',role:'PESQUISADORA UFBA',color:'#fbbf24',quote:'"Quem audita o auditor invisível?"',
  nodes:[
    { x:300, y:650, label:'Campus Ondina', title:'LABORATÓRIO DE DADOS',
      getContext: (c) => `Seu estudo prova: 73% das câmeras da prefeitura estão posicionadas para vigiar moradores de bairros pobres, formando um muro digital. Seu orientador sugere "suavizar as conclusões" para não perder financiamentos futuros.`,
      getDecisions: (c) => [{q:'Como publicar o mapeamento?',choices:[
        {text:'Publicar integralmente, denunciando "apartheid algorítmico".', ef:-1, eq:2, pr:2},
        {text:'Vazar os mapas cruamente para a mídia ativista.', ef:-2, eq:3, pr:1},
        {text:'Suavizar o texto e colocar o viés em notas de rodapé.', ef:1, eq:-2, pr:-1}
      ]}]
    },
    { x:550, y:450, label:'Brotas', title:'INCUBADORA',
      getContext: (c) => {
        if(c[0] === 2) return `A prefeitura adorou sua postura "colaborativa" no Ponto 1. Como prêmio, a Cisco Foundation oferece R$ 800 mil para seu laboratório. Mas o contrato tem uma pegadinha: eles exigem revisar suas futuras publicações.`;
        return `Sua denúncia no Ponto 1 fez barulho. Para tentar cooptar e silenciar você, a poderosa Cisco Foundation oferece R$ 800 mil de financiamento, exigindo "Revisão Antecipada" dos seus textos antes de saírem. O dinheiro comprando seu silêncio.`;
      },
      getDecisions: (c) => [{q:'Aceitar o financiamento restritivo da Cisco?',choices:[
        {text:'Assinar. O laboratório precisa sobreviver.', ef:1, eq:-2, pr:-1},
        {text:'Negociar a cláusula para um "Comitê Consultivo" brando.', ef:0, eq:0, pr:0},
        {text:'Recusar. A independência acadêmica não está à venda.', ef:-2, eq:2, pr:2}
      ]}]
    },
    { x:400, y:300, label:'Aeroporto', title:'PORTÃO DE EMBARQUE',
      getContext: (c) => {
        let txt = `Você foi convocada para depor numa CPI no Senado. `;
        if(c[1] === 0 || c[1] === 1) txt += `Contudo, os advogados da Cisco te enviaram um "lembrete amigável" sobre o termo de confidencialidade que você assinou no Ponto 2. Falar demais na CPI pode gerar multa milionária.`;
        else txt += `Você recusou o dinheiro da Cisco e manteve a independência. Para te calar, a Receita Federal abriu uma auditoria surpresa e bloqueou seu CNPJ ontem. Intimidação pura.`;
        return txt;
      },
      getDecisions: (c) => [{q:'O voo está chamando. Prosseguir com o depoimento?',choices:[
        {text:'Embarcar. Apresentar tudo na CPI ao vivo, doa a quem doer.', ef:-1, eq:3, pr:3},
        {text:'Enviar um advogado para ler uma nota técnica (Recuo tático).', ef:0, eq:1, pr:0},
        {text:'Cancelar ida e enviar apenas relatório escrito.', ef:1, eq:-2, pr:-1}
      ]}]
    }
  ]
},
rodrigo:{id:'rodrigo',name:'Rodrigo Maia',role:'ARQUITETO DE PPP',color:'#2dd4bf',quote:'"O código dita o software; o contrato dita a cidade."',
  nodes:[
    { x:550, y:700, label:'Caminho das Árvores', title:'ESCRITÓRIO DE ENGENHARIA',
      getContext: (c) => `Você está desenhando um "Template Mestre" de PPP de Cidades Inteligentes que será vendido a prefeituras. Uma cláusula permite que empresas instalem mais câmeras no futuro sem precisarem de licitação ou votação de vereadores.`,
      getDecisions: (c) => [{q:'O que fazer com a cláusula de expansão automática?',choices:[
        {text:'Manter. É o que os prefeitos compram (Agilidade).', ef:2, eq:-1, pr:-2},
        {text:'Limitar expansão a no máximo 15% da rede original.', ef:1, eq:0, pr:-1},
        {text:'Remover. Toda expansão de vigilância exigirá licitação.', ef:-1, eq:2, pr:2}
      ]}]
    },
    { x:650, y:600, label:'Centro de Convenções', title:'SMART CITY EXPO',
      getContext: (c) => {
        if(c[0] === 0) return `Seu template agressivo viralizou (38 cidades compraram). Um prefeito influente quer fechar R$ 100M com você, mas exige retirar a cláusula de "Auditoria Independente". Eles mesmos "vão fiscalizar".`;
        return `Seu template transparente assustou muitos, mas atraiu 12 cidades sérias. Um novo prefeito quer fechar R$ 100M, mas quer retirar a auditoria externa porque "custa caro".`;
      },
      getDecisions: (c) => [{q:'A cláusula de auditoria independente. Ceder ou travar?',choices:[
        {text:'Retirar a cláusula e fechar o negócio milionário.', ef:2, eq:-2, pr:-2},
        {text:'Exigir auditoria interna pelo Tribunal de Contas (Meio-termo).', ef:0, eq:1, pr:0},
        {text:'Travar negociação. Sem auditoria independente, nada feito.', ef:-1, eq:2, pr:2}
      ]}]
    },
    { x:800, y:200, label:'Costa Azul', title:'APARTAMENTO',
      getContext: (c) => {
        let txt = `Madrugada. Um contato vazou logs do Centro de Operações. Os sistemas estão rodando scripts de *geofencing* para rastrear carros de líderes sindicais secretamente. `;
        if(c[0] === 0) txt += `Eles usaram justamente as expansões sem licitação que você permitiu no Ponto 1 para focar nas sedes dos sindicatos.`;
        if(c[1] === 0) txt += ` Como você tirou a auditoria no Ponto 2, ninguém ia descobrir isso se não fosse esse vazamento.`;
        return txt;
      },
      getDecisions: (c) => [{q:'Os dados criminosos estão no seu PC.',choices:[
        {text:'Vazar para jornalista investigativo (Protocolo Seguro).', ef:-2, eq:3, pr:3},
        {text:'Denunciar ao compliance interno da empresa.', ef:0, eq:-1, pr:0},
        {text:'Deletar o arquivo. O risco corporativo é insano.', ef:1, eq:-3, pr:-2}
      ]}]
    }
  ]
},
edu:{id:'edu',name:'Edu Santos',role:'ENTREGADOR',color:'#f43f5e',quote:'"O algoritmo manda, eu pedalo."',
  nodes:[
    { x:380, y:850, label:'Pelourinho', title:'BARREIRA POLICIAL',
      getContext: (c) => `O reconhecimento facial de um poste marcou seu rosto como Alerta Vermelho. Os policiais te param com a mão no coldre. Você sabe que a câmera errou.`,
      getDecisions: (c) => [{q:'Como lidar com a abordagem?',choices:[
        {text:'Acordar com eles. Mostrar documentos e baixar a cabeça.', ef:1, eq:-2, pr:-2},
        {text:'Gravar a abordagem discretamente pelo celular.', ef:0, eq:1, pr:0},
        {text:'Fazer escândalo e exigir o registro formal do erro algorítmico.', ef:-1, eq:2, pr:1}
      ]}]
    },
    { x:450, y:600, label:'Rio Vermelho', title:'ROTA DO APP',
      getContext: (c) => {
        if(c[0] === 2) return `Depois da confusão com a polícia no Ponto 1, parece que você entrou numa 'lista negra'. O app parou de te mandar para bairros de elite (Itaigara) e só joga corridas na periferia. *Redlining* digital puro.`;
        return `O mapa térmico do app paga menos para entregas em bairros ricos e te joga rotas perigosas, enquanto entregadores de outras zonas recebem privilégio. Segregação espacial programada.`;
      },
      getDecisions: (c) => [{q:'O viés espacial do algoritmo do aplicativo.',choices:[
        {text:'Ignorar e focar entregas na periferia. Fazer dinheiro.', ef:1, eq:-2, pr:-1},
        {text:'Recusar corridas suspeitas, mesmo prejudicando seu score.', ef:-1, eq:0, pr:0},
        {text:'Ceder os prints do seu celular para Ação Coletiva do sindicato.', ef:-1, eq:2, pr:1}
      ]}]
    },
    { x:600, y:350, label:'Subúrbio', title:'GALPÃO',
      getContext: (c) => {
        let txt = `Os entregadores marcaram uma reunião secreta no galpão para planejar uma greve geral. Chegando lá, câmeras de tráfego apontam fisicamente para a porta. `;
        if(c[1] === 2) txt += `O app descobriu sobre a Ação Coletiva e está repassando a placa das motos da reunião para a prefeitura.`;
        return txt;
      },
      getDecisions: (c) => [{q:'A infraestrutura inteligente está quebrando o direito de reunião.',choices:[
        {text:'Dar meia volta. O medo de punição é real.', ef:1, eq:-2, pr:-1},
        {text:'Ficar de vigia escondido, avisando a galera pelo rádio.', ef:0, eq:1, pr:0},
        {text:'Entrar e confrontar. A reunião tem que acontecer.', ef:-1, eq:3, pr:1}
      ]}]
    }
  ]
}
};

const FINALE={
  vigiada:{color:'#f43f5e', title:'PANÓPTICO TOTAL',text:'A cidade se tornou uma máquina de extração perfeita. A burocracia protege a caixa-preta corporativa, enquanto o sistema decide quem circula livremente e quem é suspeito nato.'},
  disputa:{color:'#2dd4bf', title:'A CIDADE HACKEADA',text:'A opacidade foi perfurada. As suas escolhas geraram atrito no sistema, resultando emCPIs e leis de transparência algorítmica. O controle existe, mas a resistência agora é institucional.'},
  puxadinho:{color:'#fbbf24', title:'GAMBIARRA ALGORÍTMICA',text:'Os contratos garantiram milhões às empresas, mas a execução falhou. Câmeras superfaturadas e sistemas com bugs criaram uma vigilância fragmentada: repressiva, porém ineficiente.'}
};

// ════════════════════════════════════════
// ENGINE DE JOGO (CANVAS)
// ════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');
const hud = document.getElementById('hud');
const hints = document.getElementById('controls-hint');
const appUI = document.getElementById('app');

let S={screen:'splash', char:null, nodeIdx:0, scores:{ef:5,eq:5,pr:5}, choices:[]};
let GAME_ACTIVE = false;

// Configuração do mapa lógico 1000x1000
const MAP_W = 1000, MAP_H = 1000;
let player = { x: 500, y: 500, vx: 0, vy: 0, speed: 3, vehicle: false };
const keys = {};

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { 
  keys[e.key.toLowerCase()] = false; 
  if(e.key.toLowerCase() === 'shift' && GAME_ACTIVE && S.screen === 'map') {
    player.vehicle = !player.vehicle;
    player.speed = player.vehicle ? 6 : 3;
  }
  if(e.key === ' ' && GAME_ACTIVE && S.screen === 'map') {
    checkInteraction();
  }
});

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function checkInteraction() {
  if(!S.char) return;
  const c = CHARS[S.char];
  if(S.nodeIdx >= c.nodes.length) {
    if(dist(player, {x: 500, y: 150}) < 40) { // Extraction
      S.screen = 'charSelect';
      if(!CITY.playedChars.includes(S.char)){ CITY.playedChars.push(S.char); saveCity(CITY); }
      GAME_ACTIVE = false; renderUI();
    }
    return;
  }
  const node = c.nodes[S.nodeIdx];
  if(dist(player, node) < 30) {
    S.screen = 'node'; GAME_ACTIVE = false; renderUI();
  }
}

function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

function updatePhysics() {
  if(!GAME_ACTIVE) return;
  player.vx = 0; player.vy = 0;
  if(keys['arrowup'] || keys['w']) player.vy = -player.speed;
  if(keys['arrowdown'] || keys['s']) player.vy = player.speed;
  if(keys['arrowleft'] || keys['a']) player.vx = -player.speed;
  if(keys['arrowright'] || keys['d']) player.vx = player.speed;
  
  if(player.vx !== 0 && player.vy !== 0) { player.vx *= 0.707; player.vy *= 0.707; }
  player.x = Math.max(20, Math.min(MAP_W-20, player.x + player.vx));
  player.y = Math.max(20, Math.min(MAP_H-20, player.y + player.vy));
}

// Geração de Blocos da Cidade (Visual)
const cityBlocks = [];
for(let i=0; i<30; i++) {
  cityBlocks.push({
    x: 100 + Math.random()*800, y: 100 + Math.random()*800,
    w: 50 + Math.random()*100, h: 50 + Math.random()*100
  });
}

function drawGame() {
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if(!GAME_ACTIVE && S.screen !== 'map') return;

  const scale = Math.min(canvas.width/600, canvas.height/600);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(scale, scale);
  ctx.translate(-player.x, -player.y);

  // Grid e Ruas
  ctx.strokeStyle = 'rgba(56,189,248,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0; i<=MAP_W; i+=100) { ctx.moveTo(i,0); ctx.lineTo(i,MAP_H); }
  for(let j=0; j<=MAP_H; j+=100) { ctx.moveTo(0,j); ctx.lineTo(MAP_W,j); }
  ctx.stroke();

  // Desenha os blocos simulando a cidade
  ctx.fillStyle = '#050b14';
  cityBlocks.forEach(b => { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); });

  if(S.char) {
    const c = CHARS[S.char];
    let canInteract = false;
    
    // Nodes
    c.nodes.forEach((n, idx) => {
      if(idx < S.nodeIdx) {
        ctx.fillStyle = '#1e293b'; ctx.strokeStyle = c.color;
        ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      } else if (idx === S.nodeIdx) {
        ctx.fillStyle = c.color; ctx.shadowColor = c.color; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(n.x, n.y, 12 + Math.sin(Date.now()/200)*3, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle='#fff'; ctx.font='12px Space Mono'; ctx.fillText(n.label, n.x+20, n.y+4);
        if(dist(player, n) < 30) canInteract = true;
      } else {
        ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#475569';
        ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
    });

    if(S.nodeIdx >= c.nodes.length) {
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(500, 150, 15, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = '14px Space Mono'; ctx.fillText('PONTO DE EXTRAÇÃO (SAÍDA)', 520, 155);
      if(dist(player, {x:500,y:150}) < 40) canInteract = true;
    }

    hud.style.display = canInteract ? 'block' : 'none';
  }

  // Draw Player Avatar
  ctx.translate(player.x, player.y);
  const angle = Math.atan2(player.vy, player.vx);
  if(player.vx!==0 || player.vy!==0) ctx.rotate(angle);
  
  ctx.fillStyle = S.char ? CHARS[S.char].color : '#f8fafc';
  ctx.beginPath();
  if(player.vehicle) {
    ctx.rect(-12, -7, 24, 14); // Carro/Moto
  } else {
    ctx.moveTo(10, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); // Triângulo
  }
  ctx.fill();
  ctx.restore();
}

function loop() { updatePhysics(); drawGame(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ════════════════════════════════════════
// UI RENDERING
// ════════════════════════════════════════
function renderSplash(){return`
<div class="screen" style="text-align:center">
  <div class="display" style="font-size:clamp(3.5rem,10vw,6rem);color:var(--text-bright);">CIDADE<br><span style="color:var(--char-col);">ONLINE</span></div>
  <div class="label" style="margin:1rem 0 3rem; letter-spacing:0.3em;">SISTEMA DE RASTREAMENTO URBANO</div>
  <button class="btn" data-a="charSelect">ACESSAR SERVIDOR</button>
</div>`;}

function renderCharSelect(){
  const cs=Object.values(CHARS), allPlayed=cs.every(c=>CITY.playedChars.includes(c.id));
  return `
<div class="screen">
  <div class="label" style="margin-bottom:2rem;text-align:center;">TERMINAIS DISPONÍVEIS // ${CITY.playedChars.length}/4</div>
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.5rem; width:100%; max-width:900px; margin-bottom:3rem;">
    ${cs.map(c => {
      const played = CITY.playedChars.includes(c.id);
      return `
      <div class="panel" style="border-color:${c.color}; cursor:pointer; opacity:${played?0.4:1}" data-a="startRun" data-char="${c.id}">
        <div class="display" style="color:${c.color}; font-size:1.2rem; margin-bottom:.2rem;">${c.name}</div>
        <div class="label" style="margin-bottom:1rem;">${c.role}</div>
      </div>`;
    }).join('')}
  </div>
  ${allPlayed ? `<button class="btn" style="background:var(--teal); color:#000;" data-a="grandFinale">GERAR RELATÓRIO GLOBAL DA CIDADE</button>` : ``}
</div>`;
}

function renderNode(){
  const c = CHARS[S.char], node = c.nodes[S.nodeIdx];
  const contextText = node.getContext(S.choices);
  const decisions = node.getDecisions(S.choices)[0];
  
  return `
  <div class="screen screen-left">
    <div style="width:100%; max-width:700px; margin:0 auto;">
      <div class="label" style="color:var(--char-col); margin-bottom:.5rem;">COORDENADAS: ${node.label}</div>
      <div class="display" style="font-size:2rem; color:var(--text-bright); margin-bottom:2rem;">${node.title}</div>
      <div class="panel">
        <div style="font-size:.9rem; line-height:1.8; color:var(--text-bright); margin-bottom:2rem;">${contextText.replace(/\n/g, '<br><br>')}</div>
        <div class="label" style="color:var(--alert); font-size:.75rem; margin-bottom:1rem;">${decisions.q}</div>
        <div class="choices">
          ${decisions.choices.map((ch, i) => `
            <button class="choice-btn" data-a="choose" data-idx="${i}"><div class="choice-letter">[ OPÇÃO 0${i+1} ]</div>${ch.text}</button>
          `).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function renderConsequence(){
  return `
  <div class="screen screen-left">
    <div style="width:100%; max-width:700px; margin:0 auto;">
      <div class="label" style="color:var(--char-col); margin-bottom:.5rem;">IMPACTO REGISTRADO NA CIDADE</div>
      <div class="panel" style="border-color:var(--char-col);">
        <p style="font-size:.9rem; line-height:1.8; color:var(--text-bright);">Escolha computada na malha urbana. Prossiga para o próximo alvo.</p>
      </div>
      <div style="margin-top:2rem; display:flex; justify-content:flex-end;">
        <button class="btn" data-a="returnMap">VOLTAR AO RADAR E CONTINUAR →</button>
      </div>
    </div>
  </div>`;
}

function renderGrandFinale(){
  const arch = FINALE[S.scores.ef>=7&&S.scores.pr<=4?'vigiada':S.scores.pr>=7?'disputa':'puxadinho'];
  return `
<div class="screen">
  <div style="max-width:700px; width:100%; text-align:center;">
    <div class="label" style="color:${arch.color}; margin-bottom:.5rem;">AUDITORIA ENCERRADA</div>
    <div class="display" style="font-size:3rem; color:var(--text-bright); margin-bottom:1.5rem;">${arch.title}</div>
    <div class="panel" style="text-align:left; border-color:${arch.color};">
      <p style="font-size:.9rem; color:var(--text-bright);">${arch.text}</p>
    </div>
    <div style="margin-top:2rem;"><button class="btn btn-ghost" data-a="resetAll">REINICIAR SISTEMA (WIPE)</button></div>
  </div>
</div>`;
}

function renderUI(){
  document.documentElement.style.setProperty('--char-col', S.char ? CHARS[S.char].color : '#38bdf8');
  
  if(S.screen === 'map') {
    uiLayer.className = 'hidden'; hints.style.display = 'block';
    GAME_ACTIVE = true; hud.style.display = 'none';
  } else {
    uiLayer.className = 'in-game'; hints.style.display = 'none';
    const scr = {splash: renderSplash, charSelect: renderCharSelect, node: renderNode, consequence: renderConsequence, grandFinale: renderGrandFinale};
    appUI.innerHTML = (scr[S.screen])(); uiLayer.scrollTop = 0;
  }
}

appUI.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  
  if(a==='charSelect'){ S.screen='charSelect'; renderUI(); return; }
  if(a==='startRun'){ 
    S = {screen:'map', char:el.dataset.char, nodeIdx:0, scores:{ef:5,eq:5,pr:5}, choices:[]};
    player = { x: 500, y: 900, vx: 0, vy: 0, speed: 3, vehicle: false }; // Spawn na base do mapa
    renderUI(); return; 
  }
  if(a==='choose'){
    const idx = parseInt(el.dataset.idx);
    const ch = CHARS[S.char].nodes[S.nodeIdx].getDecisions(S.choices)[0].choices[idx];
    S.scores.ef += (ch.ef||0); S.scores.eq += (ch.eq||0); S.scores.pr += (ch.pr||0);
    S.choices.push(idx); 
    appUI.classList.add('glitch-anim'); setTimeout(()=>appUI.classList.remove('glitch-anim'),300);
    S.screen='consequence'; renderUI(); return;
  }
  if(a==='returnMap'){ S.nodeIdx++; S.screen='map'; renderUI(); return; }
  if(a==='resetAll'){ resetCity(); CITY=loadCity(); S.screen='splash'; renderUI(); return; }
});

renderUI();
</script>
</body>
</html>
