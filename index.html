<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>CIDADE ONLINE — O Labirinto Burocrático</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0c1018;--surface2:#111827;
  --border:rgba(148,163,184,.15);--text:#94a3b8;
  --text-bright:#e2e8f0;--text-dim:#475569;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --char-col:#3b82f6;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.7;overflow-x:hidden}
#app{position:relative;z-index:10;min-height:100vh}
.bg-vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(7,9,15,.95) 100%);pointer-events:none;z-index:1}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);pointer-events:none;z-index:999;animation:scanmove 12s linear infinite}
@keyframes scanmove{0%{background-position:0 0}100%{background-position:0 200vh}}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;animation:fadeIn .5s ease}
.screen-left{align-items:flex-start;justify-content:flex-start;max-width:850px;margin:0 auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.label{font-size:.65rem;text-transform:uppercase;letter-spacing:.2em;color:var(--text-dim)}
.era-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.5rem,4vw,2.5rem);color:var(--text-bright);margin:1rem 0 1.5rem;line-height:1.1}
.context-text{font-size:.95rem;line-height:1.9;color:var(--text);margin-bottom:1.5rem;border-left:2px solid var(--border);padding-left:1.5rem}
.concept-box{background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.2);padding:1.25rem;margin:1.5rem 0;font-size:.85rem;color:var(--text-bright);border-left:4px solid var(--blue)}
.concept-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:.5rem;font-weight:bold}
.choices{display:flex;flex-direction:column;gap:.8rem;width:100%;margin-top:2rem}
.choice-btn{border:1px solid var(--border);background:var(--surface);padding:1.25rem;text-align:left;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Space Mono',monospace;font-size:.85rem;line-height:1.6}
.choice-btn:hover{border-color:var(--char-col);background:var(--surface2);color:var(--text-bright)}
.consequence-box{border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.05);padding:1.5rem;margin:2rem 0;font-size:.9rem;line-height:1.8}
.reveal-box{border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.05);padding:1.5rem;font-size:.85rem;line-height:1.8;color:var(--amber)}
.btn{display:inline-flex;align-items:center;padding:.8rem 1.8rem;border:1px solid var(--char-col);color:var(--char-col);background:transparent;font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;transition:all .2s;text-transform:uppercase}
.btn:hover{background:var(--char-col);color:var(--bg)}
.btn-doc{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.05);animation:pulseDoc 2s infinite}
.btn-doc:hover{background:var(--amber);color:var(--bg)}
@keyframes pulseDoc{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 12px rgba(245,158,11,.25)}}

/* MODAL / LORE SYSTEM */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:1.5rem;opacity:0;transition:opacity .3s}
.modal-overlay.active{display:flex;opacity:1}
.doc-paper{background:#f8fafc;color:#0f172a;max-width:700px;width:100%;padding:3rem;font-family:'Courier Prime',monospace;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative;max-height:85vh;overflow-y:auto}
.doc-header{border-bottom:2px solid #cbd5e1;padding-bottom:1rem;margin-bottom:1.5rem}
.doc-meta{font-size:.75rem;text-transform:uppercase;color:#64748b;letter-spacing:.1em;font-weight:bold}
.doc-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.6rem;color:#0f172a;margin-top:.5rem}
.doc-body{font-size:.95rem;line-height:1.8;white-space:pre-wrap}
.doc-redact{background:#0f172a;color:#0f172a;user-select:none;padding:0 .2rem}
.close-doc{position:absolute;top:1rem;right:1rem;background:transparent;border:1px solid #cbd5e1;cursor:pointer;font-family:monospace;padding:.4rem 1rem;font-weight:bold;color:#0f172a}
.close-doc:hover{background:#e2e8f0}
</style>
</head>

<!-- DOCUMENT MODAL -->

  <div class="doc-paper">
    <button class="close-doc" onclick="closeDoc()">[X] FECHAR ARQUIVO</button>

function openDoc(meta, title, body) {
  document.getElementById('docMeta').innerText = meta;
  document.getElementById('docTitle').innerText = title;
  document.getElementById('docBody').innerHTML = body;
  document.getElementById('docModal').classList.add('active');
}
function closeDoc() {
  document.getElementById('docModal').classList.remove('active');
}

function getFinaleReport(c) {
  let report = { title: "", text: "", status: "" };

  // COMBINAÇÃO 1: A DISTOPIA PERFEITA
  if (c.ibmContract === 'full' && c.reportStatus === 'suppressed' && c.rodrigoTemplate === 'agile') {
    report.title = "Salvador: O Panóptico Perfeito";
    report.status = "CRÍTICO / DISTÓPICO";
    report.text = "As decisões de Marco e Rodrigo entregaram a cidade às corporações. Sem a transparência que Amara buscava, Salvador se tornou um laboratório de extrativismo de dados. O controle é absoluto, invisível e racista. O cidadão é apenas um ponto de lucro ou um alvo policial.";
  }
  // COMBINAÇÃO 2: A RESISTÊNCIA DEMOCRÁTICA
  else if (c.ibmContract === 'negotiated' && c.reportStatus === 'public' && c.amaraPublished) {
    report.title = "Salvador: A Cidade em Disputa";
    report.status = "ESTÁVEL / DEMOCRÁTICO";
    report.text = "A soberania digital foi preservada. Graças à coragem de vazar os dados e à força da pesquisa científica, o sistema de vigilância foi freado. A cidade é tecnologicamente mais lenta, mas humanamente mais justa. O povo sabe como o código funciona.";
  }
  // COMBINAÇÃO 3: O CAOS INSTITUCIONAL (O "Puxadinho")
  else if (c.ibmContract === 'full' && c.reportStatus === 'public') {
    report.title = "Salvador: O Grande Imbróglio";
    report.status = "INSTÁVEL / JUDICIALIZADO";
    report.text = "A prefeitura comprou o sistema errado e agora está presa em processos judiciais bilionários. A tecnologia está instalada, mas desligada por ordem judicial. Bilhões de reais foram jogados no lixo enquanto as ruas continuam sem infraestrutura básica.";
  }
  // PADRÃO: O FUTURO AMBÍGUO
  else {
    report.title = "Salvador: Futuro Indeterminado";
    report.status = "EM PROCESSAMENTO";
    report.text = "A cidade está num impasse. Algumas áreas são vigiadas por algoritmos opacos, enquanto outras lutam por transparência. O destino da democracia digital baiana ainda não foi decidido. A luta continua nas redes e nas ruas.";
  }
  
  return report;
}

function nav(screenId) {
  S.screen = screenId;
  if(screenId === 'splash') renderSplash();
  if(screenId === 'select') renderSelect();
  if(screenId === 'finale') renderFinale();
  window.scrollTo(0,0);
}

function renderFinale() {
  const f = getFinaleReport(CITY);
  app.innerHTML = `
    <div class="screen screen-left">
      <div class="label" style="color:var(--amber)">DIAGNÓSTICO FINAL DA CIDADE</div>
      <div class="era-title" style="font-size:3rem; color:var(--text-bright)">${f.title}</div>
      <div class="concept-box" style="border-color:var(--amber)">
        <div class="concept-title" style="color:var(--amber)">STATUS DO SISTEMA</div>
        ${f.status}
      </div>
      <div class="context-text" style="font-size:1.1rem; border-color:var(--amber)">
        ${f.text}
      </div>
      <div style="margin-top:3rem; display:flex; gap:1rem;">
        <button class="btn" onclick="resetGame()">ENCERRAR SIMULAÇÃO E APAGAR LOGS</button>
      </div>
    </div>
  `;
}
// ════════════════════════════════════════
// MOTOR DE NAVEGAÇÃO E INTERFACE (VERSÃO CORRIGIDA)
// ════════════════════════════════════════
const app = document.getElementById('app');

// Inicializa a tela
function update() {
  if (S.screen === 'splash') app.innerHTML = renderSplash();
  else if (S.screen === 'select') app.innerHTML = renderSelect();
  else if (S.screen === 'era') app.innerHTML = renderEra();
  else if (S.screen === 'finale') app.innerHTML = renderFinale();
  window.scrollTo(0, 0);
}

function nav(screenId) {
  S.screen = screenId;
  update();
}

function startNode(charId) {
  // Trava opcional: Se quiser que o Edu seja o último, avise aqui
  if (charId === 'edu' && CITY.playedChars.length < 3) {
    alert("O arquivo do Edu é o sensor final da cidade. Jogue primeiro com Marco, Amara e Rodrigo para que a realidade dele seja processada.");
    return;
  }
  
  S.char = charId;
  // Pega a primeira era definida no objeto do personagem
  const firstEra = Object.keys(CHARS[charId].eras)[0];
  S.eraId = firstEra;
  nav('era');
}

function renderSplash() {
  return `
    <div class="screen" style="text-align:center">
      <div class="label" style="margin-bottom:1.5rem">Simulador de Impacto Sistêmico</div>
      <div class="era-title" style="font-size:clamp(3.5rem,10vw,6rem);color:var(--text-bright);line-height:1">CIDADE<br><em style="color:var(--char-col);font-style:normal">ONLINE</em></div>
      <div style="font-size:.9rem;color:var(--amber);margin:2rem auto;max-width:500px">
        O futuro de Salvador não é um destino, é uma sucessão de contratos, teses e algoritmos.
      </div>
      <button class="btn" onclick="nav('select')">▶ ACESSAR TERMINAL</button>
      <div style="margin-top:1.5rem"><button class="btn btn-ghost" style="font-size:.65rem;border:none" onclick="resetGame()">⟳ APAGAR MEMÓRIA (RESET)</button></div>
    </div>
  `;
}

function renderSelect() {
  const cs = Object.values(CHARS);
  const canSeeFinale = CITY.playedChars.length >= 3;

  return `
    <div class="screen screen-left">
      <div class="label" style="margin-bottom:1rem">MÓDULO DE PERSPECTIVAS</div>
      <div class="display" style="font-size:2rem;color:var(--text-bright)">Quem você quer ser agora?</div>
      
      <div class="char-grid">
      ${cs.map(c => {
        const played = CITY.playedChars.includes(c.id);
        const isEdu = c.id === 'edu';
        return `
        <div class="char-card" style="--c-col:${c.color}; ${played ? 'opacity:0.5' : ''}" onclick="startNode('${c.id}')">
          <div class="char-name">${c.name}</div>
          <div style="font-size:.7rem; color:${c.color}; text-transform:uppercase; font-weight:bold">${c.role}</div>
          <div class="char-lens">${isEdu ? '<strong>[BLOQUEADO ATÉ TER DADOS DA CIDADE]</strong>' : c.lens}</div>
          ${played ? '<div style="margin-top:1rem; color:var(--green); font-weight:bold; font-size:0.7rem;">✓ DADOS PROCESSADOS</div>' : ''}
        </div>`;
      }).join('')}
      </div>
      
      ${canSeeFinale ? `
      <div style="margin-top:3rem; width:100%; text-align:center; border-top:1px solid var(--amber); padding-top:2rem">
        <button class="btn btn-doc" onclick="nav('finale')">★ GERAR DIAGNÓSTICO FINAL DA CIDADE</button>
      </div>` : ''}
      
      <div style="margin-top:2rem"><button class="btn btn-ghost" onclick="nav('splash')">← VOLTAR</button></div>
    </div>
  `;
}

function renderEra() {
  const c = CHARS[S.char];
  const era = c.eras[S.eraId];
  
  // Processa o contexto se ele for uma função (caso do Edu)
  let ctx = typeof era.context === 'function' ? era.context(CITY) : era.context;
  
  let docBtn = '';
  if (era.doc) {
    const d = typeof era.doc === 'function' ? era.doc(CITY) : era.doc;
    if (d) docBtn = `<button class="btn btn-doc" style="margin-bottom:1.5rem" onclick="openDoc('${d.meta}', '${d.title}', \`${d.body}\`)">📄 ANALISAR DOCUMENTO: ${d.meta}</button>`;
  }

  let conceptHtml = era.concept ? `<div class="concept-box"><div class="concept-title">${era.concept.title}</div>${era.concept.text}</div>` : '';

  // Filtra as escolhas baseadas no estado da cidade
  const choices = era.decisions[0].choices.filter(ch => !ch.showIf || ch.showIf(CITY));

  return `
    <div class="screen screen-left" style="--char-col:${c.color}">
      <div class="label" style="color:${c.color}">${c.name} · ${era.year}</div>
      <div class="era-title">${era.title}</div>
      ${docBtn}
      <div class="context-text">${ctx.replace(/\n\n/g, '<br><br>')}</div>
      ${conceptHtml}
      <div style="font-family:'Syne',sans-serif;color:var(--amber);margin-top:2rem;font-weight:700">${era.decisions[0].q}</div>
      <div class="choices">
        ${choices.map((ch, i) => `<button class="choice-btn" onclick="makeChoice(${i})">${ch.text}</button>`).join('')}
      </div>
    </div>
  `;
}

function makeChoice(idx) {
  const c = CHARS[S.char];
  const era = c.eras[S.eraId];
  const ch = era.decisions[0].choices.filter(x => !x.showIf || x.showIf(CITY))[idx];
  
  // Aplica impactos no estado global
  if (ch.impact) Object.assign(CITY, ch.impact);
  
  const isFinalNode = !ch.nextEraId;
  const nextAction = isFinalNode 
    ? `onclick="endChar()"` 
    : `onclick="S.eraId='${ch.nextEraId}'; update();"`;

  app.innerHTML = `
    <div class="screen screen-left" style="--char-col:${c.color}">
      <div class="label" style="color:var(--red)">CONSEQUÊNCIA</div>
      <div class="consequence-box">${ch.consequence}</div>
      <div class="reveal-box"><strong>Por que isso importa:</strong><br>${ch.reveal}</div>
      <div style="margin-top:2rem">
        <button class="btn" style="border-color:${c.color};color:${c.color}" ${nextAction}>
          ${isFinalNode ? 'FINALIZAR PERSPECTIVA' : 'CONTINUAR JORNADA →'}
        </button>
      </div>
    </div>
  `;
}

function endChar() {
  if (!CITY.playedChars.includes(S.char)) CITY.playedChars.push(S.char);
  saveCity(CITY);
  nav('select');
}

function resetGame() {
  localStorage.removeItem(CK);
  CITY = freshCity();
  reset();
  update();
}

// Inicia o sistema
update();
</script>
