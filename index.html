<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDADE ONLINE — Sistema de Rastreamento Urbano</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020617; --surface:#0f172a; --surface2:#1e293b;
  --border:rgba(56,189,248,.2); --text:#94a3b8;
  --text-bright:#f8fafc; --text-dim:#475569;
  --cyan:#38bdf8; --teal:#2dd4bf; --red:#f43f5e; --alert:#fbbf24;
  --char-col:#38bdf8; --grid-col:rgba(56,189,248,0.05);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.6;overflow:hidden;user-select:none;}

/* ── UI SCREENS ── */
#ui-layer{position:absolute;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;transition:background 0.3s;}
#ui-layer.in-game{background:rgba(2,6,23,0.7);backdrop-filter:blur(5px);}
#ui-layer.hidden{display:none;}

.screen{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;animation:bootUp .4s cubic-bezier(0,0.6,0.3,1)}
.screen-left{align-items:flex-start;justify-content:center;}
@keyframes bootUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.display{font-family:'Inter',sans-serif;font-weight:700;line-height:1.1;letter-spacing:-0.03em;}
.label{font-size:.6rem;text-transform:uppercase;letter-spacing:.25em;color:var(--text-dim);}
.status-indicator{display:inline-flex;align-items:center;gap:.5rem;font-size:.65rem;color:var(--cyan);text-transform:uppercase;letter-spacing:.15em;border:1px solid var(--border);padding:.3rem .8rem;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);position:absolute;top:2rem;left:2rem;z-index:30;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

.btn{display:inline-block;padding:.8rem 1.5rem;border:1px solid var(--char-col);color:var(--char-col);background:rgba(15,23,42,0.8);font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.1em;cursor:pointer;transition:all .2s;text-transform:uppercase;clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));}
.btn:hover{background:var(--char-col);color:var(--bg);box-shadow:0 0 15px rgba(56,189,248,.3);}
.btn-ghost{border-color:var(--text-dim);color:var(--text);}
.btn-ghost:hover{border-color:var(--text-bright);color:var(--text-bright);background:var(--surface2);box-shadow:none;}

.panel{background:rgba(15,23,42,0.85);border:1px solid var(--border);padding:2rem;position:relative;}
.panel::before{content:'';position:absolute;top:0;left:0;width:20px;height:20px;border-top:2px solid var(--char-col);border-left:2px solid var(--char-col);}
.panel::after{content:'';position:absolute;bottom:0;right:0;width:20px;height:20px;border-bottom:2px solid var(--char-col);border-right:2px solid var(--char-col);}

.choices{display:flex;flex-direction:column;gap:.75rem;width:100%;margin-top:2rem;}
.choice-btn{border:1px solid var(--border);background:rgba(15,23,42,0.6);padding:1.2rem;text-align:left;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;line-height:1.6;position:relative;overflow:hidden;}
.choice-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--char-col);transform:scaleY(0);transition:transform .2s;transform-origin:bottom;}
.choice-btn:hover{background:rgba(30,41,59,0.8);color:var(--text-bright);border-color:var(--text-dim);}
.choice-btn:hover::before{transform:scaleY(1);}
.choice-letter{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--char-col);margin-bottom:.4rem;letter-spacing:.1em;}

/* ── GAME CANVAS ── */
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;}
.crosshair{position:fixed;top:50%;left:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);pointer-events:none;z-index:6;border-left:1px solid rgba(56,189,248,0.05);border-top:1px solid rgba(56,189,248,0.05);}

#hud{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:10;display:none;background:rgba(15,23,42,0.8);border:1px solid var(--char-col);padding:1rem 2rem;text-align:center;color:var(--text-bright);font-family:'Space Mono';font-size:.8rem;letter-spacing:.1em;box-shadow:0 0 20px rgba(0,0,0,0.5);}
#controls-hint{position:absolute;bottom:2rem;right:2rem;z-index:10;display:none;text-align:right;font-size:.6rem;color:var(--text-dim);line-height:1.8;}

.glitch-anim{animation:glitch .3s cubic-bezier(.25,.46,.45,.94) both;}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-3px, 3px);filter:hue-rotate(-90deg)}40%{transform:translate(-3px, -3px)}60%{transform:translate(3px, 3px);filter:hue-rotate(90deg)}80%{transform:translate(3px, -3px)}100%{transform:translate(0);filter:none}}
</style>
</head>

const CK='cidadeOnline_gps_v2';
function freshCity(){return{cameras:5,transparency:5,equity:5,ibmContract:null,reportStatus:null,schoolBiometrics:null,amaraPublished:false,amaraIndependent:false,cpiDeponent:false,rodrigoTemplate:null,rodrigoWhistle:false,playedChars:[],totalPlays:0};}
function loadCity(){try{return JSON.parse(localStorage.getItem(CK))||freshCity();}catch{return freshCity();}}
function saveCity(c){try{localStorage.setItem(CK,JSON.stringify(c));}catch(e){console.warn("Storage bloqueado");}}
let CITY=loadCity();

function applyImpact(imp){
  if(!imp)return;
  if(imp.cameras) CITY.cameras=Math.max(1,Math.min(10,CITY.cameras+imp.cameras));
  if(imp.transparency) CITY.transparency=Math.max(1,Math.min(10,CITY.transparency+imp.transparency));
  if(imp.equity) CITY.equity=Math.max(1,Math.min(10,CITY.equity+imp.equity));
  Object.entries(imp).forEach(([k,v])=>{if(!['cameras','transparency','equity'].includes(k))CITY[k]=v;});
  saveCity(CITY);
}

// ════════════════════════════════════════
// ENGINE: CANVAS & GAMEPLAY
// ════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');
const hud = document.getElementById('hud');
const hints = document.getElementById('controls-hint');
const appUI = document.getElementById('app');

let S={screen:'splash', char:null, nodeIdx:0, scores:{ef:5,eq:5,pr:5}, choices:[]};
let GAME_ACTIVE = false;

// Configuração do mapa lógico 1000x1000
const MAP_W = 1000, MAP_H = 1000;
let player = { x: 500, y: 500, vx: 0, vy: 0, speed: 2.5, vehicle: false };
const keys = {};

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { 
  keys[e.key.toLowerCase()] = false; 
  if(e.key.toLowerCase() === 'shift' && GAME_ACTIVE && S.screen === 'map') {
    player.vehicle = !player.vehicle;
    player.speed = player.vehicle ? 5 : 2.5;
  }
  if(e.key === ' ' && GAME_ACTIVE && S.screen === 'map') {
    checkInteraction();
  }
});

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function checkInteraction() {
  if(!S.char) return;
  const c = CHARS[S.char];
  if(S.nodeIdx >= c.nodes.length) {
    if(dist(player, {x: 500, y: 500}) < 40) {
      // Ponto de extração (terminar)
      S.screen = 'charSelect';
      if(!CITY.playedChars.includes(S.char)){ CITY.playedChars.push(S.char); saveCity(CITY); }
      GAME_ACTIVE = false;
      renderUI();
    }
    return;
  }
  
  const node = c.nodes[S.nodeIdx];
  if(dist(player, node) < 30) {
    S.screen = 'node';
    GAME_ACTIVE = false; // Pausa movimento
    renderUI();
  }
}

function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

function updatePhysics() {
  if(!GAME_ACTIVE) return;
  
  player.vx = 0; player.vy = 0;
  if(keys['arrowup'] || keys['w']) player.vy = -player.speed;
  if(keys['arrowdown'] || keys['s']) player.vy = player.speed;
  if(keys['arrowleft'] || keys['a']) player.vx = -player.speed;
  if(keys['arrowright'] || keys['d']) player.vx = player.speed;
  
  // Normalizar diagonal
  if(player.vx !== 0 && player.vy !== 0) {
    player.vx *= 0.707; player.vy *= 0.707;
  }

  player.x = Math.max(20, Math.min(MAP_W-20, player.x + player.vx));
  player.y = Math.max(20, Math.min(MAP_H-20, player.y + player.vy));
}

function drawGame() {
  ctx.fillStyle = '#020617';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if(!GAME_ACTIVE && S.screen !== 'map') return;

  // Câmera segue o jogador
  const scale = Math.min(canvas.width/600, canvas.height/600);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.scale(scale, scale);
  ctx.translate(-player.x, -player.y);

  // Grid
  ctx.strokeStyle = 'rgba(56,189,248,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0; i<=MAP_W; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,MAP_H); }
  for(let j=0; j<=MAP_H; j+=50) { ctx.moveTo(0,j); ctx.lineTo(MAP_W,j); }
  ctx.stroke();

  if(S.char) {
    const c = CHARS[S.char];
    let canInteract = false;
    
    // Draw Nodes
    c.nodes.forEach((n, idx) => {
      if(idx < S.nodeIdx) {
        ctx.fillStyle = '#1e293b'; ctx.strokeStyle = c.color;
        ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      } else if (idx === S.nodeIdx) {
        // Active node
        ctx.fillStyle = c.color;
        ctx.shadowColor = c.color; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(n.x, n.y, 12 + Math.sin(Date.now()/200)*3, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        
        if(dist(player, n) < 30) canInteract = true;
      } else {
        ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#475569';
        ctx.beginPath(); ctx.arc(n.x, n.y, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      }
    });

    // Extraction Point Se acabou
    if(S.nodeIdx >= c.nodes.length) {
      ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(500, 500, 15, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = '10px Space Mono'; ctx.fillText('PONTO DE EXTRAÇÃO', 480, 470);
      if(dist(player, {x:500,y:500}) < 40) canInteract = true;
    }

    hud.style.display = canInteract ? 'block' : 'none';
  }

  // Draw Player Avatar
  ctx.translate(player.x, player.y);
  const angle = Math.atan2(player.vy, player.vx);
  if(player.vx!==0 || player.vy!==0) ctx.rotate(angle);
  
  ctx.fillStyle = S.char ? CHARS[S.char].color : '#f8fafc';
  ctx.beginPath();
  if(player.vehicle) {
    // Retângulo/Carro
    ctx.rect(-10, -6, 20, 12);
  } else {
    // Triângulo/Avatar
    ctx.moveTo(8, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6);
  }
  ctx.fill();
  ctx.restore();
}

function loop() {
  updatePhysics();
  drawGame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ════════════════════════════════════════
// HTML UI RENDERING
// ════════════════════════════════════════
function renderSplash(){return`
<div class="screen" style="text-align:center">
  <div class="display" style="font-size:clamp(3.5rem,10vw,6rem);color:var(--text-bright);">CIDADE<br><span style="color:var(--char-col);">ONLINE</span></div>
  <div class="label" style="margin:1rem 0 3rem; letter-spacing:0.3em;">SISTEMA DE RASTREAMENTO URBANO</div>
  <button class="btn" data-a="charSelect">INICIAR SISTEMA</button>
</div>`;}

function renderCharSelect(){
  const cs=Object.values(CHARS), allPlayed=cs.every(c=>CITY.playedChars.includes(c.id));
  return `
<div class="screen">
  <div class="label" style="margin-bottom:2rem;text-align:center;">MÓDULO DE ACESSO // TERMINAIS DISPONÍVEIS</div>
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.5rem; width:100%; max-width:900px; margin-bottom:3rem;">
    ${cs.map(c => {
      const played = CITY.playedChars.includes(c.id);
      return `
      <div class="panel" style="border-color:${c.color}; cursor:pointer; opacity:${played?0.5:1}" data-a="startRun" data-char="${c.id}">
        <div class="display" style="color:${c.color}; font-size:1.2rem; margin-bottom:.2rem;">${c.name}</div>
        <div class="label" style="margin-bottom:1rem;">${c.role}</div>
      </div>`;
    }).join('')}
  </div>
  ${allPlayed ? `<button class="btn" style="background:var(--teal); color:#000;" data-a="grandFinale">GERAR RELATÓRIO GLOBAL DA CIDADE</button>` : ``}
</div>`;
}

function renderNode(){
  const c = CHARS[S.char], node = c.nodes[S.nodeIdx];
  return `
  <div class="screen screen-left">
    <div style="width:100%; max-width:700px; margin:0 auto;">
      <div class="label" style="color:var(--char-col); margin-bottom:.5rem;">COORDENADAS ALCANÇADAS // ${node.label}</div>
      <div class="display" style="font-size:2rem; color:var(--text-bright); margin-bottom:2rem;">${node.title}</div>
      <div class="panel">
        <div style="font-size:.9rem; line-height:1.8; color:var(--text-bright); margin-bottom:2rem;">${node.context.replace(/\n/g, '<br>')}</div>
        <div class="label" style="color:var(--alert); font-size:.7rem; margin-bottom:1rem;">${node.q}</div>
        <div class="choices">
          ${node.decisions[0].choices.map((ch, i) => `
            <button class="choice-btn" data-a="choose" data-idx="${i}"><div class="choice-letter">[ OPÇÃO 0${i+1} ]</div>${ch.text}</button>
          `).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function renderConsequence(){
  const c = CHARS[S.char], node = c.nodes[S.nodeIdx], ch = node.decisions[0].choices[S.choices[S.choices.length-1]];
  return `
  <div class="screen screen-left">
    <div style="width:100%; max-width:700px; margin:0 auto;">
      <div class="label" style="color:var(--char-col); margin-bottom:.5rem;">IMPACTO REGISTRADO</div>
      <div class="panel" style="border-color:var(--char-col);">
        <p style="font-size:.9rem; line-height:1.8; color:var(--text-bright);">${ch.consequence}</p>
      </div>
      <div style="margin-top:2rem; display:flex; justify-content:flex-end;">
        <button class="btn" data-a="returnMap">VOLTAR AO RADAR →</button>
      </div>
    </div>
  </div>`;
}

function renderGrandFinale(){
  const arch = FINALE[getCityArchetype()];
  return `
<div class="screen">
  <div style="max-width:700px; width:100%; text-align:center;">
    <div class="label" style="color:${arch.color}; margin-bottom:.5rem;">AUDITORIA ENCERRADA</div>
    <div class="display" style="font-size:3rem; color:var(--text-bright); margin-bottom:1.5rem;">${arch.title}</div>
    <div class="panel" style="text-align:left; border-color:${arch.color};">
      <p style="font-size:.9rem; color:var(--text-bright);">${arch.text}</p>
    </div>
    <div style="margin-top:2rem;"><button class="btn btn-ghost" data-a="resetAll">REINICIAR SISTEMA</button></div>
  </div>
</div>`;
}

function renderUI(){
  document.documentElement.style.setProperty('--char-col', S.char ? CHARS[S.char].color : '#38bdf8');
  
  if(S.screen === 'map') {
    uiLayer.className = 'hidden';
    hints.style.display = 'block';
    GAME_ACTIVE = true;
    hud.style.display = 'none'; // reset
  } else {
    uiLayer.className = 'in-game';
    hints.style.display = 'none';
    const scr = {splash: renderSplash, charSelect: renderCharSelect, node: renderNode, consequence: renderConsequence, grandFinale: renderGrandFinale};
    appUI.innerHTML = (scr[S.screen])();
    uiLayer.scrollTop = 0;
  }
}

appUI.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  
  if(a==='charSelect'){ S.screen='charSelect'; renderUI(); return; }
  if(a==='startRun'){ 
    S = {screen:'map', char:el.dataset.char, nodeIdx:0, scores:{ef:5,eq:5,pr:5}, choices:[]};
    // Spawn player na base do mapa
    player = { x: 500, y: 900, vx: 0, vy: 0, speed: 2.5, vehicle: false };
    renderUI(); return; 
  }
  if(a==='choose'){
    const idx = parseInt(el.dataset.idx);
    const ch = CHARS[S.char].nodes[S.nodeIdx].decisions[0].choices[idx];
    S.scores.ef += (ch.ef||0); S.scores.eq += (ch.eq||0); S.scores.pr += (ch.pr||0);
    S.choices.push(idx); applyImpact(ch.impact);
    appUI.classList.add('glitch-anim'); setTimeout(()=>appUI.classList.remove('glitch-anim'),300);
    S.screen='consequence'; renderUI(); return;
  }
  if(a==='returnMap'){ S.nodeIdx++; S.screen='map'; renderUI(); return; }
  if(a==='resetAll'){ resetCity(); CITY=loadCity(); S.screen='splash'; renderUI(); return; }
});

renderUI();
</script>
</body>
</html>
