<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDADE ONLINE — A Complexidade da Vigilância</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0c1018;--surface2:#111827;
  --border:rgba(148,163,184,.15);--text:#94a3b8;
  --text-bright:#e2e8f0;--text-dim:#475569;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--green:#10b981;
  --char-col:#3b82f6;--dystopia:0;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.7;transition:background .7s;overflow-x:hidden}
#app{position:relative;z-index:10;min-height:100vh}
.bg-vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(7,9,15,.95) 100%);pointer-events:none;z-index:1}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);pointer-events:none;z-index:999;animation:scanmove 12s linear infinite}
@keyframes scanmove{0%{background-position:0 0}100%{background-position:0 200vh}}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;animation:fadeIn .5s ease}
.screen-left{align-items:flex-start;justify-content:flex-start;max-width:800px;margin:0 auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.label{font-size:.65rem;text-transform:uppercase;letter-spacing:.2em;color:var(--text-dim)}
.label-accent{color:var(--char-col)}
.display{font-family:'Syne',sans-serif;font-weight:800;line-height:1.05}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.8rem;border:1px solid var(--char-col);color:var(--char-col);background:transparent;font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.08em;cursor:pointer;transition:all .2s;text-transform:uppercase}
.btn:hover{background:var(--char-col);color:var(--bg)}
.btn-ghost{border-color:var(--border);color:var(--text-dim)}
.btn-ghost:hover{border-color:var(--text-dim);color:var(--text-bright);background:var(--surface2)}
.btn-doc{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.05);animation:pulseDoc 2s infinite}
.btn-doc:hover{background:var(--amber);color:var(--bg)}
@keyframes pulseDoc{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 10px rgba(245,158,11,.2)}}
.char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem;width:100%;max-width:900px;margin-top:2rem}
.char-card{border:1px solid var(--border);background:var(--surface);padding:1.5rem;cursor:pointer;transition:all .2s;position:relative}
.char-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c-col);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.char-card:hover{border-color:var(--c-col);background:var(--surface2)}
.char-card:hover::after{transform:scaleX(1)}
.char-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--text-bright);margin-bottom:.3rem}
.char-role{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:1rem}
.char-lens{font-size:.75rem;color:var(--text-dim);line-height:1.7;border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem}
.era-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.5rem,4vw,2.5rem);color:var(--text-bright);margin:1rem 0 1.5rem;line-height:1.1}
.context-text{font-size:.9rem;line-height:1.9;color:var(--text);margin-bottom:1.5rem;border-left:2px solid var(--border);padding-left:1.5rem}
.concept-box{background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.2);padding:1rem;margin:1rem 0;font-size:.8rem;color:var(--text-bright);border-left:3px solid var(--blue)}
.concept-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);margin-bottom:.5rem;font-weight:bold}
.choices{display:flex;flex-direction:column;gap:.8rem;width:100%;margin-top:2rem}
.choice-btn{border:1px solid var(--border);background:var(--surface);padding:1.25rem;text-align:left;cursor:pointer;transition:all .2s;color:var(--text);font-family:'Space Mono',monospace;font-size:.85rem;line-height:1.6}
.choice-btn:hover{border-color:var(--char-col);background:var(--surface2);color:var(--text-bright)}
.consequence-box{border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.05);padding:1.5rem;margin:2rem 0;font-size:.9rem;line-height:1.8}
.reveal-box{border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.05);padding:1.5rem;font-size:.85rem;line-height:1.8;color:var(--amber)}
/* MODAL / LORE SYSTEM */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:1.5rem;opacity:0;transition:opacity .3s}
.modal-overlay.active{display:flex;opacity:1}
.doc-paper{background:#f8fafc;color:#0f172a;max-width:650px;width:100%;padding:2.5rem;font-family:'Courier Prime',monospace;box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative;max-height:85vh;overflow-y:auto}
.doc-header{border-bottom:2px solid #cbd5e1;padding-bottom:1rem;margin-bottom:1.5rem}
.doc-meta{font-size:.7rem;text-transform:uppercase;color:#64748b;letter-spacing:.1em}
.doc-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;color:#0f172a;margin-top:.5rem}
.doc-body{font-size:.9rem;line-height:1.8;white-space:pre-wrap}
.doc-redact{background:#0f172a;color:#0f172a;user-select:none;padding:0 .2rem}
.close-doc{position:absolute;top:1rem;right:1rem;background:transparent;border:1px solid #cbd5e1;cursor:pointer;font-family:monospace;padding:.3rem .8rem;font-weight:bold}
.close-doc:hover{background:#e2e8f0}
</style>
</head>
<body>
<div class="bg-vignette"></div>
<div class="scanlines"></div>
<div id="app"></div>

<!-- DOCUMENT MODAL -->
<div class="modal-overlay" id="docModal">
  <div class="doc-paper">
    <button class="close-doc" onclick="closeDoc()">[X] FECHAR</button>
    <div class="doc-header">
      <div class="doc-meta" id="docMeta">CONFIDENCIAL</div>
      <div class="doc-title" id="docTitle">Documento</div>
    </div>
    <div class="doc-body" id="docBody">Conteúdo...</div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// CITY STATE
// ════════════════════════════════════════
const CK='cidade_v6_deep';
function freshCity(){return{ibmContract:null, reportStatus:null, amaraPublished:null, rodrigoTemplate:null, playedChars:[]};}
function loadCity(){try{return JSON.parse(localStorage.getItem(CK))||freshCity();}catch{return freshCity();}}
function saveCity(c){localStorage.setItem(CK,JSON.stringify(c));}
let CITY=loadCity();

// MODAL LOGIC
function openDoc(meta, title, body) {
  document.getElementById('docMeta').innerText = meta;
  document.getElementById('docTitle').innerText = title;
  document.getElementById('docBody').innerHTML = body;
  document.getElementById('docModal').classList.add('active');
}
function closeDoc() {
  document.getElementById('docModal').classList.remove('active');
}

// ════════════════════════════════════════
// GAME DATA - COMPLEX BRANCHING & LORE
// ════════════════════════════════════════
const CHARS={
// -----------------------------------------
// MARCO - O ARQUITETO DO ESTADO
// -----------------------------------------
marco:{
  id:'marco',name:'Marco Santos',role:'Secretário de Inovação',color:'#3b82f6',
  lens:'Você assina as Parcerias Público-Privadas (PPPs). Suas decisões criam o "lock-in" tecnológico (quando a cidade fica refém de uma única empresa).',
  eras: {
    'e1_inicio': {
      year:'2014', label:'ERA 01', title:'O Cavalo de Troia Luminoso',
      context:`A cidade quer modernizar 80 mil pontos de luz. Uma Big Tech oferece trocar tudo por LED "de graça", contanto que ganhe a concessão por 20 anos. O pulo do gato está nos sensores acoplados aos postes.\n\nEles querem instalar microfones, câmeras e sensores de Wi-Fi, alegando que é para "otimização de tráfego". O contrato de PPP exige que os *metadados* (quem passa, a que horas, com quem) fiquem em servidores privados da empresa na nuvem, sem auditoria da prefeitura.`,
      doc: { meta:'MINUTA CONTRATUAL - PPP ILUMINAÇÃO', title:'Cláusula 4.1.2 - Propriedade de Dados', body:`4.1.2. Fica estabelecido que a Concessionária deterá os direitos de exploração comercial dos Metadados Urbanos (incluindo, mas não se limitando a: volumetria de tráfego, heatmaps de fluxo de pedestres, e rastreamento de MAC Addresses via Wi-Fi) gerados pela infraestrutura durante a vigência de 20 (vinte) anos deste instrumento.\n\nParágrafo Único: O Município terá acesso apenas a dashboards resumidos, abdicando do acesso aos dados brutos alegados como Segredo Industrial da Concessionária.`},
      concept: { title: 'Lock-in Tecnológico', text: 'Quando o governo adota uma tecnologia fechada (proprietária), tornando-se dependente daquela empresa. Se a prefeitura quiser mudar o sistema no futuro, o custo de romper o contrato e trocar os cabos/servidores é tão alto que ela fica "trancada".' },
      decisions:[{q:'Você aceita a privatização invisível dos dados em troca de infraestrutura rápida?', choices:[
        {
          text:'Assina o contrato integral. A cidade precisa de LED e segurança agora. Os dados são o preço do progresso.', 
          nextEraId: 'e2_caminho_cego', impact:{ibmContract:'full'},
          consequence:'O contrato é assinado com festa. A cidade fica iluminada. Nos bastidores, a empresa começa a criar perfis de comportamento da população. A prefeitura não sabe o que o algoritmo faz, apenas recebe relatórios mastigados.',
          reveal:'Cidades Inteligentes muitas vezes operam como "extrativistas de dados": oferecem infraestrutura física em troca da extração predatória e sem consentimento da vida nas ruas.'
        },
        {
          text:'Exige um aditivo: A prefeitura deve ser a dona soberana dos dados brutos e o código deve ser auditável.', 
          nextEraId: 'e2_caminho_negociado', impact:{ibmContract:'negotiated'},
          consequence:'A negociação trava. A empresa ameaça desistir. Após meses, eles cedem o controle dos dados ao município, mas removem as câmeras avançadas do pacote. O prefeito te odeia pelo atraso político.',
          reveal:'Soberania digital custa capital político. Você evitou a privatização da vigilância, mas pagou o preço do atraso.'
        }
      ]}]
    },
    'e2_caminho_cego': {
      year:'2019', label:'ERA 02 (O Desastre do Viés)', title:'Falsos Positivos',
      context:`O sistema que você comprou de "caixa preta" foi atualizado para fazer Reconhecimento Facial no Carnaval. No terceiro dia de festa, a Polícia Militar deteve 14 pessoas. 13 eram inocentes. Todas eram jovens negros.\n\nOs engenheiros da prefeitura conseguiram analisar uma brecha no sistema e geraram um relatório confidencial provando que o algoritmo tem 96% de erro quando analisa rostos não-brancos (viés algorítmico). A empresa ameaça processar a prefeitura se o relatório vazar, citando "Quebra de Segredo Industrial".`,
      doc: { meta:'RELATÓRIO TÉCNICO INTERNO', title:'Análise de Viés - Sistema Câmeras', body:`Amostragem: 120.000 capturas faciais durante o evento.\n\nTaxa de Confiança (Falsos Positivos):\n- Homens Brancos: 1.4% de erro\n- Mulheres Brancas: 3.2% de erro\n- Homens Negros: <span class="doc-redact">96.8% de erro</span>\n- Mulheres Negras: <span class="doc-redact">98.1% de erro</span>\n\nConclusão: O dataset de treinamento da Concessionária foi alimentado predominantemente com rostos caucasianos europeus. O uso do sistema no Brasil resulta em hiper-criminalização sistêmica.`},
      concept: { title: 'Viés Algorítmico (Racismo Algorítmico)', text: 'Sistemas de IA aprendem com bancos de imagens. Se a empresa gringa treinou a IA com fotos de pessoas brancas, o sistema tem extrema dificuldade em ler os traços de pessoas negras, confundindo rostos inocentes com fotos de procurados.' },
      decisions:[{q:'O que você faz com o relatório interno?', choices:[
        {
          text:'Engaveta como "Documento Sigiloso". Suspende o uso discretamente, sem alarde, para não ser processado.', 
          nextEraId: null, impact:{reportStatus:'suppressed'},
          consequence:'O escândalo não estoura, o contrato segue firme. O sistema continua operando silenciosamente nas periferias. Pessoas continuam sendo paradas injustamente, mas sem gerar manchetes.',
          reveal:'A conveniência burocrática transforma racismo estrutural em "erro de software tolerável". Você escolheu proteger a máquina.'
        },
        {
          text:'Vaza o relatório anonimamente para a pesquisadora Amara Silva da Universidade Federal.', 
          nextEraId: null, impact:{reportStatus:'public'},
          consequence:'O vazamento causa pânico nacional. O Ministério Público intervém e suspende a PPP. A prefeitura paga uma multa rescisória astronômica. Você perde o cargo, mas o sistema é desligado.',
          reveal:'A transparência forçada quebrou o sistema. Você agiu como um "Whistleblower" (denunciante) dentro da máquina do Estado.'
        }
      ]}]
    },
    'e2_caminho_negociado': {
      year:'2019', label:'ERA 02 (A Guerra dos Servidores)', title:'O Blefe',
      context:`Como a prefeitura tem os dados sob seu controle, a Big Tech está perdendo dinheiro (ela queria vender esses dados para seguradoras). A empresa decide "descontinuar" a manutenção do software na véspera do Carnaval, exigindo que você assine um aditivo devolvendo a propriedade dos dados a eles.`,
      decisions:[{q:'Como você reage à chantagem da empresa?', choices:[
        {
          text:'Cede. Assina o aditivo entregando os dados. A cidade não pode ficar sem câmeras no Carnaval.', 
          nextEraId: null, impact:{ibmContract:'full', reportStatus:'suppressed'},
          consequence:'Eles vencem pelo cansaço. A cidade tem um Carnaval seguro, mas os dados dos cidadãos viram mercadoria corporativa novamente.',
          reveal:'O Estado moderno frequentemente capitula diante do monopólio tecnológico porque tem medo de voltar ao analógico.'
        },
        {
          text:'Rescinde o contrato. Usa o código aberto para religar as câmeras com servidores da própria prefeitura.', 
          nextEraId: null, impact:{ibmContract:'negotiated'},
          consequence:'A prefeitura cria sua própria nuvem pública. O sistema é tosco, cai de vez em quando, mas não extrai dados e obedece à Lei Geral de Proteção de Dados (LGPD).',
          reveal:'Tecnologia pública não precisa ser perfeita, precisa ser auditável e democrática.'
        }
      ]}]
    }
  }
},

// -----------------------------------------
// AMARA - A CIÊNCIA COMO RESISTÊNCIA
// -----------------------------------------
amara:{
  id:'amara',name:'Amara Silva',role:'Pesquisadora e Ativista',color:'#f59e0b',
  lens:'Você investiga os impactos sociais da tecnologia. Seu desafio é provar para a sociedade que a "cidade inteligente" muitas vezes reproduz a desigualdade física no meio digital.',
  eras: {
    'inicio': {
      year:'2021', label:'ERA ÚNICA', title:'O Confronto Acadêmico',
      context:(c) => {
        let base = `Você lidera um laboratório na Universidade focado em governança digital. `;
        if (c.reportStatus === 'suppressed') {
           base += `\n\nVocê desconfia profundamente do sistema de câmeras da Prefeitura. Você sabe que ele erra, mas o Secretário Marco engavetou todas as provas. O prefeito acabou de anunciar a "expansão" do sistema para a periferia.`;
        } else if (c.reportStatus === 'public') {
           base += `\n\nVocê acabou de receber, via e-mail anônimo criptografado, o **RELATÓRIO EXPLOSIVO** da prefeitura vazado pelo ex-secretário Marco! As provas do racismo algorítmico estão na sua mão.`;
        } else {
           base += `\n\nA prefeitura instalou sensores pela cidade, mas se recusa a informar os critérios de implementação.`;
        }
        return base;
      },
      doc: (c) => c.reportStatus === 'public' 
        ? { meta:'EMAIL CRIPTOGRAFADO (PROTONMAIL)', title:'Fwd: Relatório de Viés - URGENTE', body:`Dra. Amara,\n\nEles tentaram apagar isso. O sistema errou em 96% dos casos com jovens negros no último Carnaval. O modelo estatístico que eles usam é criminoso. Estou te mandando os logs em anexo. \n\nFaça o que tem que ser feito.\n\n- M.`}
        : null,
      concept: { title: 'Auditoria Cidadã', text: 'Quando entidades civis ou universidades utilizam ciência de dados reversa para analisar, expor e processar as decisões tomadas por algoritmos opacos de governos e grandes empresas.' },
      decisions:[{q:'Qual a estratégia do seu laboratório para este ano?', choices:[
        {
          showIf: (c) => c.reportStatus === 'public',
          text:'Publicar o documento vazado em uma revista científica internacional e ir ao Ministério Público exigir a prisão dos gestores.', 
          nextEraId: null, impact:{amaraPublished:true},
          consequence:'O estudo "A Máquina de Prender" vira referência mundial. A prefeitura é alvo da Polícia Federal. Você consegue banir o reconhecimento facial na Bahia.',
          reveal:'Dados bem documentados têm o poder de derrubar impérios tecnológicos.'
        },
        {
          text:'Fazer uma pesquisa cartográfica própria, mapeando as câmeras pelas ruas a pé (crowdsourcing).', 
          nextEraId: null, impact:{amaraPublished:true},
          consequence:'Seus alunos passam meses mapeando os postes. Vocês descobrem que bairros ricos têm "sensores de chuva", enquanto bairros pobres só têm "câmeras de segurança direcionadas a pontos de ônibus".',
          reveal:'A tecnologia urbana não é neutra. Ela mapeia o território com base nos preconceitos de quem assinou o cheque.'
        },
        {
          text:'Aceitar um patrocínio da mesma Big Tech que instalou as câmeras para investigar "ética em IA", assinando NDA (Acordo de Confidencialidade).', 
          nextEraId: null, impact:{amaraPublished:false},
          consequence:'O laboratório fica rico, compra computadores novos. A Big Tech usa sua universidade para fazer "Ethics Washing" (lavagem ética), abafando críticas enquanto diz que apoia a ciência.',
          reveal:'A cooptação acadêmica é uma das estratégias de Relações Públicas mais antigas das corporações.'
        }
      ]}]
    }
  }
},

// -----------------------------------------
// EDU - O TERCEIRO IMPACTO (DINÂMICO)
// -----------------------------------------
edu:{
  id:'edu',name:'Edu Santos',role:'Entregador de App',color:'#a78bfa',
  lens:'Você vive as consequências. As decisões contratuais do Marco e as pesquisas da Amara moldam a sua rotina, o seu dinheiro e a sua segurança.',

        {

        }
      ]}]

}
};

// ════════════════════════════════════════
// GAME ENGINE
// ════════════════════════════════════════
let S={screen:'splash',char:null,eraId:null};

function reset(){S={screen:'splash',char:null,eraId:null};}

function getFinaleContent(c) {
  let title = "Salvador: O Código Fonte";
  let text = "";
  
  if (c.ibmContract === 'full' && c.reportStatus === 'suppressed' && !c.amaraPublished) {
    title = "Distopia de Vigilância Máxima";
    text = "A cidade se tornou uma eficiente máquina de extrativismo de dados. O contrato de 20 anos firmado por Marco cimentou um sistema de caixas-pretas corporativas. Como Amara foi cooptada e o viés do algoritmo foi abafado, a vigilância opera de forma silenciosa e letal nas periferias. Trabalhadores como Edu sofrem abordagens diárias validadas por IA. O solucionismo venceu, a democracia perdeu.";
  } else if (c.ibmContract === 'full' && c.reportStatus === 'public' && c.amaraPublished) {
    title = "O Choque do Vazamento";
    text = "O sistema foi instalado, mas a blindagem falhou. O vazamento do relatório por Marco e a validação científica por Amara criaram uma tempestade perfeita. A prefeitura enfrenta CPIs e processos bilionários. Trabalhadores usaram esses dados para organizar greves históricas. A tecnologia de controle encontrou um freio na transparência radical.";
  } else if (c.ibmContract === 'negotiated' && c.amaraPublished) {
    title = "Soberania e Resistência";
    text = "Marco atrasou a infraestrutura, mas garantiu a posse dos dados. Amara expôs as falhas lógicas da governança urbana. A cidade é mais lenta e menos iluminada do que os panfletos de marketing prometiam, mas é dona do próprio destino. A tecnologia pública, mesmo imperfeita, provou ser o único caminho para não criminalizar a pobreza.";
  } else {
    title = "O Puxadinho Tecnológico";
    text = "A governança urbana brasileira clássica: ambígua e remendada. Contratos assinados às pressas, resistências acadêmicas pontuais e trabalhadores tentando sobreviver no meio do caos. Algumas câmeras funcionam, outras estão quebradas. O futuro cyberpunk chegou, mas está mal distribuído e cheio de gambiarras institucionais.";
  }
  return {title, text};
}

function renderSplash(){return`
<div class="screen" style="text-align:center">
  <div style="margin-bottom:1.5rem"><span class="label">Simulação Operacional</span></div>
  <div class="display" style="font-size:clamp(3rem,10vw,6rem);color:var(--text-bright);line-height:1">CIDADE<br><em style="color:var(--char-col);font-style:normal">ONLINE</em></div>
  <div style="font-size:.8rem;color:var(--amber);margin:2rem auto;max-width:500px">Um simulador focado na complexidade da governança digital, extrativismo de dados e justiça social.</div>
  <button class="btn" onclick="nav('select')">▶ INICIAR SISTEMA</button>
  <div style="margin-top:1.5rem"><button class="btn btn-ghost" style="font-size:.65rem;border:none" onclick="resetGame()">⟳ ZERAR SAVE STATE</button></div>
</div>`;}

function renderSelect(){
  const cs=Object.values(CHARS);
  const playedEdu=CITY.playedChars.includes('edu');
  
  return`
<div class="screen screen-left">
  <div class="label" style="margin-bottom:1rem">MÓDULO DE PERSPECTIVAS</div>
  <div class="display" style="font-size:2rem;color:var(--text-bright)">Por qual lente você lerá a cidade?</div>
  <div style="margin-bottom:2rem;font-size:.8rem;color:var(--text-dim)">Jogue com todos para gerar o relatório de impacto consolidado.</div>
  
  <div class="char-grid">
  ${cs.map(c=>{
    const p=CITY.playedChars.includes(c.id);
    return`
    <div class="char-card" style="--c-col:${c.color}; ${p?'opacity:0.6':''}" onclick="startChar('${c.id}')">
      <div class="char-name">${c.name}</div>
      <div class="char-role" style="color:${c.color}">${c.role}</div>
      <div style="font-size:.8rem;color:var(--text)">${p?'[DADOS JÁ COLETADOS]':'[INICIAR CADEIA DE DECISÕES]'}</div>
      <div class="char-lens">${c.lens}</div>
    </div>`;
  }).join('')}
  </div>
  
  ${CITY.playedChars.length>=3 ? `
  <div style="margin-top:3rem;width:100%;text-align:center">
    <button class="btn btn-doc" onclick="nav('finale')">★ ABRIR RELATÓRIO TÉCNICO DA CIDADE (GRAN FINALE)</button>
  </div>` : ''}
</div>`;}

function renderEra(){
  const c=CHARS[S.char], era=c.eras[S.eraId];
  let ctx=typeof era.context==='function'?era.context(CITY):era.context;
  
  let docHtml='';
  if(era.doc){
    const d=typeof era.doc==='function'?era.doc(CITY):era.doc;
    if(d) docHtml=`<button class="btn btn-doc" style="margin-bottom:1.5rem" onclick="openDoc('${d.meta}', '${d.title}', \`${d.body}\`)">📄 ABRIR DOCUMENTO SECRETO: ${d.meta}</button>`;
  }
  
  let conceptHtml='';
  if(era.concept) conceptHtml=`<div class="concept-box"><div class="concept-title">${era.concept.title}</div>${era.concept.text}</div>`;

  const choices=era.decisions[0].choices.filter(ch=>!ch.showIf || ch.showIf(CITY));

  return`
<div class="screen screen-left" style="--char-col:${c.color}">
  <div class="label" style="color:${c.color}">${c.name} · ${era.year}</div>
  <div class="era-title">${era.title}</div>
  
  ${docHtml}
  <div class="context-text">${ctx.replace(/\n\n/g,'<br><br>')}</div>
  ${conceptHtml}
  
  <div style="font-family:'Syne',sans-serif;color:var(--amber);margin-top:2rem;font-weight:700">${era.decisions[0].q}</div>
  <div class="choices">
    ${choices.map((ch,i)=>`<button class="choice-btn" onclick="makeChoice(${i})">${ch.text}</button>`).join('')}
  </div>
</div>`;}

function renderConseq(ch){
  const c=CHARS[S.char];
  const nextBtn=ch.nextEraId
    ? `<button class="btn" style="border-color:${c.color};color:${c.color}" onclick="S.eraId='${ch.nextEraId}'; update();">AVANÇAR PARA A PRÓXIMA FASE →</button>`
    : `<button class="btn" style="border-color:${c.color};color:${c.color}" onclick="endChar()">FINALIZAR EXPEDIENTE →</button>`;
    
  return`
<div class="screen screen-left" style="--char-col:${c.color}">
  <div class="label" style="color:${c.color}">CONSEQUÊNCIA DA AÇÃO</div>
  <div class="consequence-box"><strong>O que aconteceu materialmente:</strong><br><br>${ch.consequence}</div>
  <div class="reveal-box"><strong>Análise Crítica:</strong><br><br>${ch.reveal}</div>
  <div style="margin-top:2rem">${nextBtn}</div>
</div>`;}

function renderFinale(){
  const f=getFinaleContent(CITY);
  return`
<div class="screen screen-left">
  <div class="label">DIAGNÓSTICO ALGORÍTMICO MUNICIPAL</div>
  <div class="era-title" style="font-size:3rem;color:var(--amber)">${f.title}</div>
  <div class="context-text" style="font-size:1.1rem">${f.text}</div>
  <div style="margin-top:3rem"><button class="btn btn-ghost" onclick="resetGame()">ENCERRAR E APAGAR DADOS</button></div>
</div>`;}

// NAV ENGINE
const app=document.getElementById('app');
function update(){
  if(S.screen==='splash') app.innerHTML=renderSplash();
  if(S.screen==='select') app.innerHTML=renderSelect();
  if(S.screen==='era') app.innerHTML=renderEra();
  if(S.screen==='finale') app.innerHTML=renderFinale();
  window.scrollTo(0,0);
}
function nav(sc){S.screen=sc;update();}
function startChar(id){
  S.char=id; S.eraId=Object.keys(CHARS[id].eras)[0]; nav('era');
}
function makeChoice(idx){
  const c=CHARS[S.char], ch=c.eras[S.eraId].decisions[0].choices.filter(x=>!x.showIf || x.showIf(CITY))[idx];
  if(ch.impact) Object.assign(CITY, ch.impact);
  app.innerHTML=renderConseq(ch);
  window.scrollTo(0,0);
}
function endChar(){
  if(!CITY.playedChars.includes(S.char)) CITY.playedChars.push(S.char);
  saveCity(CITY);
  nav('select');
}
function resetGame(){
  localStorage.removeItem(CK); CITY=freshCity(); reset(); update();
}

update();
</script>
</body>
</html>
