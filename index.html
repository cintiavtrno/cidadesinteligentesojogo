<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIDADE ONLINE — Cidades Inteligentes no Brasil</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0c1018;--surface2:#111827;
  --border:rgba(148,163,184,.1);--text:#94a3b8;
  --text-bright:#e2e8f0;--text-dim:#475569;
  --red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--green:#10b981;
  --char-col:#3b82f6;--dystopia:0;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;font-size:14px;line-height:1.7;transition:background .7s}
#app{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0}
.bg-vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(7,9,15,.92) 100%);pointer-events:none;z-index:1}
.scanlines{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:999;animation:scanmove 12s linear infinite}
@keyframes scanmove{0%{background-position:0 0}100%{background-position:0 200vh}}
.distort-bg{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at top left,rgba(239,68,68,calc(var(--dystopia)*0.07)) 0%,transparent 55%),radial-gradient(ellipse at bottom right,rgba(239,68,68,calc(var(--dystopia)*0.04)) 0%,transparent 45%);transition:background .9s}
.screen{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem;animation:fadeIn .4s ease}
.screen-left{align-items:flex-start;justify-content:flex-start;padding-top:5rem;padding-bottom:4rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.display{font-family:'Syne',sans-serif;font-weight:800;line-height:1.05}
.label{font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;color:var(--text-dim)}
.label-accent{color:var(--char-col)}
.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#10b981;margin-right:.5rem;animation:blink 2s ease-in-out infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.splash-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(3.5rem,12vw,8rem);letter-spacing:-.03em;color:var(--text-bright);text-align:center;line-height:.95}
.splash-title em{color:var(--char-col);font-style:normal}
.splash-meta{font-size:.65rem;color:var(--text-dim);text-align:center;margin:.75rem 0 2.5rem;letter-spacing:.25em;text-transform:uppercase}
.splash-tagline{font-family:'Syne',sans-serif;font-size:clamp(.95rem,2.5vw,1.25rem);color:var(--amber);text-align:center;max-width:520px;margin-bottom:3rem;line-height:1.5}
.btn{display:inline-block;padding:.7rem 1.8rem;border:1px solid var(--char-col);color:var(--char-col);background:transparent;font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.08em;cursor:pointer;transition:all .2s;text-transform:uppercase}
.btn:hover{background:var(--char-col);color:var(--bg)}
.btn-ghost{border-color:var(--border);color:var(--text-dim)}
.btn-ghost:hover{border-color:var(--text-dim);color:var(--text-bright);background:var(--surface2)}
.btn-finale{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.06);animation:pulseBtn 2.5s ease-in-out infinite}
.btn-finale:hover{background:var(--amber);color:var(--bg)}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 16px rgba(245,158,11,.3)}}
.char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.1rem;width:100%;max-width:980px;margin-top:1.5rem}
.char-card{border:1px solid var(--border);background:var(--surface);padding:1.4rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.char-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c-col,#3b82f6);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.char-card:hover{border-color:var(--c-col);background:var(--surface2)}
.char-card:hover::after{transform:scaleX(1)}
.char-card.played::before{content:'✓ JOGADO';position:absolute;top:.6rem;right:.7rem;font-size:.55rem;letter-spacing:.15em;color:var(--text-dim)}
.char-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:var(--text-bright);margin-bottom:.2rem}
.char-role{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.15rem}
.char-city{font-size:.7rem;color:var(--text-dim);margin-bottom:.85rem}
.char-quote{font-size:.75rem;font-style:italic;border-left:2px solid;padding-left:.7rem;margin-bottom:.85rem;line-height:1.6}
.char-lens{font-size:.7rem;color:var(--text-dim);line-height:1.7}
.game-header{width:100%;max-width:740px;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.era-badge{font-size:.68rem;color:var(--text-dim);background:var(--surface2);padding:.25rem .8rem;border:1px solid var(--border)}
.timeline{width:100%;max-width:740px;display:flex;margin-bottom:2rem}
.tl-item{flex:1;text-align:center;font-size:.58rem;letter-spacing:.08em;color:var(--text-dim);position:relative;padding-top:.6rem;text-transform:uppercase;transition:color .3s}
.tl-item::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--border);transition:background .3s}
.tl-item.tl-done::before{background:var(--text-dim)}
.tl-item.tl-active{color:var(--char-col)}
.tl-item.tl-active::before{background:var(--char-col)}
.era-year{font-size:.68rem;color:var(--amber);text-transform:uppercase;letter-spacing:.2em;margin-bottom:.75rem}
.era-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.4rem,4vw,2.4rem);color:var(--text-bright);margin-bottom:1.5rem;max-width:740px;width:100%;line-height:1.1}
.context-text{width:100%;max-width:740px;font-size:.87rem;line-height:2;color:var(--text);margin-bottom:1.5rem;border-left:1px solid var(--border);padding-left:1.25rem}
.context-addendum{border-left:2px solid var(--amber);padding:.6rem 1rem;margin-top:1rem;font-size:.78rem;color:var(--amber);font-style:italic;line-height:1.8}
.decision-q{font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;color:var(--amber);margin-bottom:1.5rem;max-width:740px;width:100%}
.choices{display:flex;flex-direction:column;gap:.65rem;width:100%;max-width:740px}
.choice-btn{border:1px solid var(--border);background:var(--surface);padding:1rem 1.25rem;text-align:left;cursor:pointer;transition:all .18s;color:var(--text);font-family:'Space Mono',monospace;font-size:.82rem;line-height:1.7}
.choice-btn:hover{border-color:var(--char-col);background:var(--surface2);color:var(--text-bright)}
.choice-letter{font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--text-dim);margin-bottom:.3rem}
/* ── NEWS TICKER ── */
.ticker-wrap{width:100%;max-width:740px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.05);display:flex;align-items:stretch;overflow:hidden;margin-bottom:1.75rem;height:34px}
.ticker-live{flex-shrink:0;background:var(--red);color:#fff;font-size:.6rem;letter-spacing:.15em;padding:0 .9rem;display:flex;align-items:center;text-transform:uppercase;font-weight:700}
.ticker-scroll{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.ticker-inner{white-space:nowrap;font-size:.7rem;color:#fca5a5;letter-spacing:.04em;animation:tickerScroll 28s linear infinite;will-change:transform}
@keyframes tickerScroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
/* ── CONSEQUENCE ── */
.consequence-box{border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.04);padding:1.4rem;margin:1.4rem 0;max-width:740px;width:100%}
.consequence-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--red);margin-bottom:.75rem}
.consequence-text{font-size:.87rem;line-height:1.9;color:var(--text-bright)}
.reveal-box{border:1px solid rgba(245,158,11,.3);background:rgba(245,158,11,.04);padding:1rem 1.25rem;max-width:740px;width:100%;font-size:.8rem;line-height:1.8;color:var(--amber);font-style:italic}
.reveal-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.15em;color:rgba(245,158,11,.6);margin-bottom:.5rem}
.manchetes{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;max-width:740px;width:100%;margin-top:1.25rem}
.manchete{padding:.9rem 1rem;border:1px solid;font-size:.75rem;line-height:1.7}
.manchete-label{font-size:.55rem;text-transform:uppercase;letter-spacing:.18em;margin-bottom:.45rem;opacity:.7}
.manchete-mainstream{border-color:rgba(148,163,184,.2);color:var(--text)}
.manchete-mainstream .manchete-label{color:var(--text-dim)}
.manchete-alt{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.03);color:#fca5a5}
.manchete-alt .manchete-label{color:var(--red)}
/* ── CITY PANEL ── */
.city-panel{width:100%;max-width:980px;margin-bottom:1.5rem;border:1px solid var(--border);background:var(--surface);padding:1rem 1.25rem}
.city-panel-title{font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--text-dim);margin-bottom:.75rem}
.city-flags{display:flex;gap:.65rem;flex-wrap:wrap}
.city-flag{font-size:.63rem;padding:.2rem .6rem;border:1px solid;letter-spacing:.04em}
.city-flag-active{border-color:rgba(239,68,68,.4);color:#fca5a5;background:rgba(239,68,68,.05)}
.city-flag-neutral{border-color:var(--border);color:var(--text-dim)}
.city-flag-good{border-color:rgba(16,185,129,.4);color:#6ee7b7;background:rgba(16,185,129,.05)}
/* ── SCORES ── */
.scores-wrap{width:100%;max-width:740px;margin:1.75rem 0}
.score-row{display:flex;align-items:center;gap:1rem;margin-bottom:.75rem}
.score-label{font-size:.65rem;color:var(--text-dim);width:110px;text-transform:uppercase;letter-spacing:.05em}
.score-track{flex:1;height:3px;background:var(--surface2);overflow:hidden}
.score-fill{height:100%;transition:width .9s cubic-bezier(.25,.1,.25,1)}
.score-val{font-size:.65rem;color:var(--text-dim);width:32px;text-align:right}
/* ── ENDING ── */
.ending-wrap{max-width:700px;width:100%}
.ending-type-badge{display:inline-block;font-size:.6rem;text-transform:uppercase;letter-spacing:.2em;padding:.3rem .8rem;border:1px solid;margin-bottom:1.25rem}
.ending-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.8rem,5vw,3rem);color:var(--text-bright);margin-bottom:1.75rem;line-height:1.1}
.ending-text{font-size:.88rem;line-height:2.1;color:var(--text);margin-bottom:2rem}
.ending-stats{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;margin:1.5rem 0}
.stat-block{text-align:center}
.stat-num{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;display:block}
.stat-desc{font-size:.62rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:.2rem}
.footnote{font-size:.63rem;color:var(--text-dim);line-height:1.9;margin-top:2rem;border-top:1px solid var(--border);padding-top:1rem;font-style:italic}
hr.div{border:none;border-top:1px solid var(--border);margin:1.75rem 0;width:100%;max-width:740px}
.spacer{height:1.5rem}
.char-intro-text{font-size:.87rem;line-height:2.05;color:var(--text);max-width:680px;width:100%;margin-bottom:2rem}
/* ── GRAND FINALE ── */
.finale-header{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,7vw,4.5rem);line-height:1;text-align:center;margin-bottom:.5rem}
.finale-sub{font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;text-align:center;margin-bottom:2.5rem;color:var(--text-dim)}
.finale-archetype-badge{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;padding:.35rem .9rem;border:1px solid;margin-bottom:1.25rem}
.finale-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(1.6rem,5vw,2.8rem);margin-bottom:1.5rem;line-height:1.1}
.finale-text{font-size:.88rem;line-height:2.1;margin-bottom:2rem}
.audit-list{width:100%;max-width:700px;margin:1.5rem 0;border:1px solid var(--border);background:var(--surface)}
.audit-title{font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--text-dim);padding:.75rem 1rem;border-bottom:1px solid var(--border)}
.audit-item{padding:.65rem 1rem;border-bottom:1px solid var(--border);font-size:.78rem;line-height:1.7;display:flex;gap:.75rem;align-items:flex-start}
.audit-item:last-child{border-bottom:none}
.audit-icon{flex-shrink:0;margin-top:.1rem}
.audit-bad{color:#fca5a5}
.audit-good{color:#6ee7b7}
.city-meter{max-width:700px;width:100%;margin:1.5rem 0}
.city-meter-title{font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--text-dim);margin-bottom:1rem}
.meter-row{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.meter-label{font-size:.68rem;color:var(--text);width:130px}
.meter-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.meter-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.25,.1,.25,1)}
.meter-val{font-size:.7rem;width:36px;text-align:right}
.glitch-anim{animation:glitch .4s step-end}
@keyframes glitch{0%{filter:none}15%{filter:hue-rotate(80deg) saturate(2);transform:translate(2px,0)}35%{filter:invert(.08);transform:translate(-2px,0)}55%{filter:hue-rotate(-60deg)}75%{filter:saturate(1.5)}100%{filter:none;transform:none}}
@media(max-width:640px){.char-grid{grid-template-columns:1fr}.screen{padding:2rem .9rem}.screen-left{padding-top:3.5rem}.manchetes{grid-template-columns:1fr}.ending-stats{gap:1.25rem}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-vignette"></div>
<div class="scanlines"></div>
<div class="distort-bg"></div>
<div id="app"></div>
<script>
// ════════════════════════════════════════
// CITY STATE
// ════════════════════════════════════════
const CK='cidadeOnline_v3_city';
function freshCity(){return{cameras:5,transparency:5,equity:5,ibmContract:null,reportStatus:null,schoolBiometrics:null,amaraPublished:false,amaraIndependent:false,cpiDeponent:false,rodrigoTemplate:null,rodrigoWhistle:false,playedChars:[],totalPlays:0};}
function loadCity(){try{return JSON.parse(localStorage.getItem(CK))||freshCity();}catch{return freshCity();}}
function saveCity(c){
  try{
    localStorage.setItem(CK,JSON.stringify(c));
  } catch(e){
    console.warn("Armazenamento local bloqueado. O progresso não será salvo.", e);
  }
}
function resetCity(){saveCity(freshCity());}
let CITY=loadCity();
function applyImpact(imp){
  if(!imp)return;
  if(imp.cameras) CITY.cameras=Math.max(1,Math.min(10,CITY.cameras+imp.cameras));
  if(imp.transparency) CITY.transparency=Math.max(1,Math.min(10,CITY.transparency+imp.transparency));
  if(imp.equity) CITY.equity=Math.max(1,Math.min(10,CITY.equity+imp.equity));
  Object.entries(imp).forEach(([k,v])=>{if(!['cameras','transparency','equity'].includes(k))CITY[k]=v;});
  saveCity(CITY);
}
 
// ════════════════════════════════════════
// LIVE TICKER DATA
// ════════════════════════════════════════
const AMBIENT_TICKERS=[
  'Smart City Expo 2025: Salvador concorre a prêmio de "Melhor Cidade Inteligente do Hemisfério Sul"',
  'BID anuncia financiamento de US$ 240M para projetos de smart cities no Brasil',
  'Pesquisa: 78% dos brasileiros apoiam câmeras de segurança em espaços públicos',
  'IBM Smarter Cities: contrato de 20 anos inclui transferência de tecnologia, diz nota',
  'Plano Nacional de IoT: 80% das capitais terão sensores urbanos até 2028',
  'Censo IBGE 2024: 54% da população brasileira se autodeclara preta ou parda',
  'LGPD completa 5 anos: apenas 12% dos contratos públicos têm cláusulas de proteção de dados',
  'ONU: cidades inteligentes podem reduzir emissões de carbono em 15% até 2030',
  'Associação de Municípios: PPPs de iluminação já cobrem 60% das capitais brasileiras',
  'Estudo MIT: reconhecimento facial erra 34% mais em rostos negros do que em brancos',
];
function getCityTickers(){
  const t=[];
  if(CITY.cameras>=7) t.push('ALERTA: Densidade de câmeras em Salvador supera cidades europeias de referência');
  if(CITY.ibmContract==='full') t.push('Contrato IBM ativo: 1.900 câmeras com sensores de áudio e movimento em 2.400 postes');
  if(CITY.reportStatus==='suppressed') t.push('Relatório técnico sobre câmeras "ainda em análise" pela secretaria — segundo ano consecutivo');
  if(CITY.reportStatus==='public') t.push('Relatório da Prefeitura: 96% de falsos positivos no carnaval — uso de reconhecimento facial suspenso');
  if(CITY.schoolBiometrics) t.push('Biometria em 47 escolas: sindicato de professores questiona base legal do armazenamento de dados');
  if(CITY.rodrigoTemplate==='expansionist') t.push('38 municípios expandiram sistemas de câmeras sem licitação desde 2017');
  if(CITY.rodrigoWhistle) t.push('URGENTE: CPI de Vigilância — documentos revelam uso de smart cities para monitorar ativistas');
  if(CITY.cpiDeponent) t.push('CPI AO VIVO: depoimento sobre viés racial em câmeras está sendo transmitido pelo Senado Federal');
  if(CITY.amaraPublished) t.push('Pesquisa UFBA: 73% das câmeras de Salvador estão em bairros com renda abaixo de 1 salário mínimo');
  return t;
}
function getCharTickers(charId){
  const t={
    marco:['Prefeito anuncia meta de "Salvador 100% inteligente" até 2026','Secretaria de Inovação: modernização preserva privacidade dos cidadãos, afirma titular','Empresa de tecnologia vence licitação com proposta 40% mais barata — detalhes do contrato são sigilo'],
    amara:['FAPESB aumenta fundo de pesquisa em tecnologia e sociedade em 22%','Orientadores pedem "mais rigor e menos ativismo" em pesquisas sobre vigilância, dizem estudantes','Cisco Foundation anuncia R$ 2M em bolsas para pesquisa em "uso responsável de IA"'],
    rodrigo:['Mercado de PPPs de smart cities movimenta R$ 8,4 bilhões em 2021 no Brasil','IPGC apresenta novo modelo de contrato para expansão de smart cities em municípios pequenos','Consultores de PPP relatam aumento de 60% na demanda de prefeituras por "cidades inteligentes"'],
    edu:['App de delivery anuncia "melhores condições para parceiros" — entregadores contestam','Salvador: entregadores de app pedalaram 12 milhões de km em 2023','Algoritmo de delivery: empresa nega discriminação geográfica em resposta a denúncia coletiva'],
  };
  return t[charId]||[];
}
function buildTickerText(charId){
  const all=[...getCityTickers(),...getCharTickers(charId),...AMBIENT_TICKERS];
  const shuffled=all.sort(()=>Math.random()-.5).slice(0,6);
  return shuffled.join(' · ');
}
 
// ════════════════════════════════════════
// GRAND FINALE DATA
// ════════════════════════════════════════
const FINALE={
  vigiada:{
    color:'#ef4444',
    archetype:'CIDADE VIGIADA',
    title:'Salvador, 2026 — a mais monitorada do Hemisfério Sul',
    text:`A promessa foi cumprida. A cidade é eficiente. Os semáforos inteligentes coordenam o tráfego. O Centro Histórico tem iluminação LED em cada esquina. A taxa de criminalidade no Pelourinho caiu 34% — segundo os números da SSP-BA.\n\nNos bairros periféricos, a mesma tecnologia que protege o turista identifica "suspeitos" com 96% de erro. Os contratos duram 20 anos. A empresa trocou de nome duas vezes. Ninguém sabe ao certo o que os sensores capturam ou para onde os dados vão.\n\nEm 2025, Salvador ganhou um prêmio em Barcelona. O prefeito foi ao palco. Na plateia: representantes da IBM, da Cisco e do BID.\n\nA cidade está iluminada. A cidade está vigiada. Para a maioria dos moradores, é difícil saber se é a mesma coisa.`,
  },
  disputa:{
    color:'#10b981',
    archetype:'CIDADE EM DISPUTA',
    title:'Salvador, 2026 — uma cidade que aprendeu a questionar',
    text:`Não é uma utopia. Seria desonesto chamar assim.\n\nÉ uma cidade com mais ferramentas para se defender dos próprios sistemas. Relatórios foram publicados. Audiências foram realizadas. Alguns contratos têm cláusulas de auditoria. Uma pesquisadora depôs no Senado. Um engenheiro perdeu o emprego e vazou o que sabia. Um entregador registrou o incidente que ninguém quis registrar por ele.\n\nO sistema de vigilância ainda existe. Os contratos ainda duram 20 anos. A empresa ainda sabe mais sobre os moradores do que a prefeitura.\n\nMas agora existe resistência documentada. Isso é diferente de não existir resistência. É pouco. É o que há.\n\nUma cidade em disputa não é uma cidade resolvida. É uma cidade onde o poder não age sem que alguém registre, questione e torne público.`,
  },
  puxadinho:{
    color:'#f59e0b',
    archetype:'PUXADINHO TECNOLÓGICO',
    title:'Salvador, 2026 — improvisada, resiliente, ambígua',

function getAuditItems(){

  if(CITY.reportStatus==='suppressed') items.push(bad('Relatório de 96% de falsos positivos em reconhecimento facial foi suprimido pela prefeitura'));
  if(CITY.reportStatus==='public') items.push(good('Relatório de viés racial em câmeras foi publicado — referência nacional'));
  if(CITY.reportStatus==='internal') items.push(bad('Relatório de viés encaminhado internamente — nenhuma auditoria independente realizada'));
  if(CITY.schoolBiometrics===true) items.push(bad('Biometria em 47 escolas — 14.000 crianças com dados biométricos em servidor privado'));
  if(CITY.schoolBiometrics===false) items.push(good('Aditivo de biometria escolar bloqueado — dados de crianças não foram coletados'));
  if(CITY.amaraPublished) items.push(good('Pesquisa sobre concentração de câmeras em bairros negros publicada e distribuída'));
  else if(CITY.amaraPublished===false&&CITY.playedChars.includes('amara')) items.push(bad('Pesquisa sobre câmeras suavizada após reunião com secretaria — dado principal em nota de rodapé'));
  if(CITY.amaraIndependent===true) items.push(good('Lab de pesquisa manteve independência — financiamento Cisco recusado'));
  if(CITY.amaraIndependent===false) items.push(bad('Lab aceitou financiamento com cláusula de censura — autocensura documentada pelos próprios pesquisadores'));
  if(CITY.cpiDeponent) items.push(good('Pesquisadora depôs na CPI de Vigilância — depoimento ao vivo para 180.000 pessoas'));
  if(CITY.rodrigoTemplate==='expansionist') items.push(bad('Template de PPP permite expansão de câmeras sem licitação em 38 cidades'));
  if(CITY.rodrigoTemplate==='controlled') items.push(good('Template revisado exige licitação para expansões — 12 municípios com maior controle democrático'));
  if(CITY.rodrigoWhistle===true) items.push(good('Documentos sobre rastreamento de ativistas vazados — CPI aberta, lei aprovada'));
  if(CITY.rodrigoWhistle===false&&CITY.playedChars.includes('rodrigo')) items.push(bad('Documentos sobre rastreamento de ativistas retidos — monitoramento continuou'));
  if(!items.length) items.push({bad:null,text:'Nenhuma decisão registrada. Jogue com os personagens para construir o histórico da cidade.'});
  return items;
}

function cityAddendum(charId,eraIdx){
  if(charId==='edu'){

      const p=[];
      if(CITY.cameras>=7) p.push('A cidade está densa de câmeras. Fruto de anos de contratos de PPP — cada poste é uma antena.');

      if(CITY.reportStatus==='suppressed') p.push('Um relatório sobre 96% de falsos positivos foi arquivado por quem deveria ter publicado.');
      return p.join(' ');
    }
    if(eraIdx===1){
      if(CITY.rodrigoTemplate==='expansionist') return 'O template que colocou os sensores nas ruas foi desenhado para expandir silenciosamente — sem licitação, sem votação.';
      if(CITY.transparency<=3) return 'Os contratos que governam os sensores ao seu redor não têm cláusulas de auditoria. Ninguém sabe o que é coletado.';
    }
    if(eraIdx===2){
      if(CITY.cpiDeponent) return 'Uma pesquisadora depôs no Senado sobre os sistemas que afetam pessoas como você. Você estava fazendo entrega quando o depoimento foi ao vivo.';
      if(CITY.schoolBiometrics) return 'Biometria já foi instalada nas escolas. Seu sobrinho tem 11 anos. O rosto dele está num servidor em Frankfurt desde 2023.';
    }
  }
  if(charId==='amara'&&eraIdx===0){
    if(CITY.cameras>=7) return 'A cidade já tem uma rede densa de câmeras — instaladas em contratos anteriores. Você pesquisa um sistema que outra pessoa decidiu construir.';
  }
  if(charId==='rodrigo'&&eraIdx===2){
    if(CITY.amaraPublished) return 'Uma pesquisadora da UFBA publicou dados sobre o viés racial nos sistemas. O relatório circula há anos. Os contratos continuam do mesmo jeito.';
  }
  return'';
}

endings:{control:{type:'ARQUITETO DO LOCK-IN',title:'O Template Replicado',text:`2025. O nome de Rodrigo Maia não aparece em lugar nenhum.\n\nSeu template está em 63 municípios. Ele não sabe o que os sensores que especificou estão capturando agora, nas cidades onde nunca foi.\n\nO contrato mais antigo que assinou vence em 2036.`},human:{type:'O CUSTO DA CONSCIÊNCIA',title:'O Contrato que Não Existia',text:`2025. Rodrigo perdeu a consultoria.\n\nEm 2026, uma lei limita o uso de sensores para vigilância de movimentos sociais. Um senador citou "documentos anônimos que revelaram a natureza do problema".\n\nRodrigo assistiu ao voto ao vivo. Ficou em silêncio por um tempo considerável.`},collapse:{type:'ZONA CINZENTA',title:'A Cláusula Esquecida',text:`2025. Rodrigo tentou reformar por dentro.\n\nConseguiu cláusulas de auditoria em 11 contratos. Em 8, nunca foram realizadas.\n\nOs documentos que recebeu continuam no HD. O template original está em 38 cidades. O revisado, em 12. A diferença mora com ele.`},ambiguous:{type:'RESPONSABILIDADE TÉCNICA',title:'O Engenheiro que Soube',text:`2025. Rodrigo não salvou ninguém. Também não destruiu nada.\n\nAlgumas cláusulas existem porque ele insistiu. Alguns contratos são menos opacos.\n\nÉ pouco. É real. Parece que não há saída limpa disso — e isso também é uma informação importante sobre o sistema.`}}
},
edu:{id:'edu',name:'Carlos Eduardo "Edu" Santos',role:'Entregador de Aplicativo',city:'Salvador, BA · 2019–2024',color:'#a78bfa',quote:'"Eu não decido nada. Mas tudo que decidiram cai em cima de mim."',lens:'Você não controla o sistema. Você é controlado por ele. Sua jornada é o termômetro das decisões dos outros.',intro:`É 2019. Você tem 31 anos, faz entregas de aplicativo há 4 anos, e conhece Salvador como a palma da mão. Cada câmera no caminho, cada sensor no poste, cada semáforo que prioriza carros de luxo — você sente no bolso e no corpo.\n\nVocê não tomou nenhuma das grandes decisões sobre a cidade. Mas vai viver todas as consequências delas.\n\nEssa é a sua jornada.`,
eras:[
{id:'e1',year:'2019',label:'ERA 01',title:'A Câmera Nunca Erra',
context:`Fevereiro de 2019. Você está numa padaria no Pelourinho esperando um pedido. Dois policiais entram. Um aponta para você.\n\n"Câmera te identificou como suspeito." Você sabe que não é você. Você tem uma entrega para fazer. Você sabe que a câmera erra — principalmente com pessoas como você.\n\nO policial segura a mão no coldre.`,
decisions:[{q:'Você foi identificado por câmera. O policial está na sua frente.',choices:[
{text:'Cede. Mostra documentos, não questiona. Mais rápido assim.',ef:1,eq:-2,pr:-2,impact:{equity:-1},consequence:'Você é liberado em 40 minutos. A entrega foi cancelada. Nota ruim no app. Índice caiu. Você não registrou o incidente. A câmera vai errar de novo.',reveal:'Cada vez que alguém cede sem registrar, o sistema aprende que pode continuar errando sem consequência.',hl:{main:'Sistema de segurança de Salvador tem taxa de sucesso de 90% em identificações, diz SSP-BA',alt:'96% dos alertas foram falsos positivos — negros são maioria absoluta dos abordados por câmeras'}},
{text:'Questiona. Pede para ver a correspondência. Sabe que tem esse direito.',ef:-1,eq:2,pr:1,impact:{equity:1},consequence:'O policial fica irritado. 2 horas. Um supervisor confirma o erro. Você documenta tudo. Seu relato vai para uma ONG de direitos digitais — vira uma das 264 fichas catalogadas.',reveal:'Você perdeu o dia de trabalho. Seu caso existe num banco de dados de evidências. Ambas as coisas são verdade.',hl:{main:'Jovem cria incidente ao questionar abordagem policial baseada em câmera inteligente',alt:'Entregador documenta falso positivo de reconhecimento facial: "Eu sabia que não era eu"'}}
]}]},
{id:'e2',year:'2021',label:'ERA 02',title:'O Algoritmo Conhece Seus Atalhos',
context:`Você descobre, comparando notas com outros entregadores no grupo de WhatsApp, que o app oferece gorjetas menores para entregas em bairros ricos e sugere rotas mais longas para essas áreas.\n\nVocê não tem prova. Só tem o padrão que vê toda semana.\n\nUm colega está documentando. Quer ir à imprensa. Pede que você contribua com seus dados.`,
decisions:[{q:'O padrão algorítmico. Você documenta ou aceita e segue?',choices:[

{text:'Documenta e contribui com seus dados para o levantamento coletivo.',ef:-1,eq:2,pr:1,impact:{equity:1},consequence:'O levantamento de 40 entregadores vai para um veículo de jornalismo de dados. O app nega. Um estudo da UFRJ confirma o padrão 18 meses depois. O app lança "revisão do algoritmo". Nada muda de forma mensurável.',reveal:'A evidência existiu. A mudança não existiu. São coisas diferentes. A evidência às vezes precisa de mais tempo.',hl:{main:'Entregadores denunciam aplicativo por suposta discriminação algorítmica em Salvador',alt:'Levantamento de 40 entregadores comprova: algoritmo de delivery opera segregação geográfica'}}
]}]},
{id:'e3',year:'2023–2024',label:'ERA 03',title:'A Reunião Monitorada',
context:`Um coletivo organizou uma reunião para discutir condições de trabalho e os sistemas de vigilância que afetam entregadores. O local é num bairro popular. Há câmeras na rua.\n\nNa véspera, um colega envia no grupo: "Cuidado. A reunião foi marcada pelo sistema como 'aglomeração suspeita'."\n\nVocê não sabe se é verdade. Sabe que pode ser.`,
decisions:[{q:'A reunião é amanhã. O risco é real ou percebido. O que você decide?',choices:[

{text:'Não vai. É arriscado demais. Você tem família que depende de você.',ef:0,eq:-2,pr:-1,impact:{equity:-1},consequence:'A reunião acontece sem você. Mais 12 entregadores também ficaram em casa. O coletivo encolheu. O medo funcionou — não como punição, mas como prevenção de organização.',reveal:'A vigilância não precisa prender ninguém para ser eficaz. Basta fazer as pessoas decidirem não se reunir.',hl:{main:'Coletivo de entregadores realiza reunião online por questões de segurança',alt:'Entregadores relatam autocensura crescente: "Tenho medo de ir a reuniões presenciais"'}}
]}]}
],
endings:{control:{type:'INVISIBILIDADE APRENDIDA',title:'Fluir Pelo Sistema',text:`2024. Edu aprendeu como ser invisível para o sistema.\n\nSabe quais ruas têm mais câmeras. Quais horários ativam mais alertas. Que não deve questionar.\n\nEle é um especialista em sobreviver numa cidade que não foi projetada para ele.\n\nO sistema funcionou como projetado.`},human:{type:'TESTEMUNHO NECESSÁRIO',title:'Seu Relato no Processo',text:`2024. O relato de Edu foi incluído como evidência numa ação coletiva contra o uso de reconhecimento facial sem regulamentação em Salvador.\n\nEle não vai ao tribunal. Não sabe como o processo vai terminar. Continua fazendo entregas.\n\nMas seu nome está num documento jurídico que desafia um sistema que achava que ele nunca ia questionar.`},collapse:{type:'DESGASTE SILENCIOSO',title:'O Preço do Cotidiano',text:`2024. Nada mudou de forma visível.\n\nEdu foi abordado 3 vezes em 5 anos por câmeras de reconhecimento facial. Nenhuma vez era ele. Nenhuma vez foi registrado como erro.\n\nEle ainda faz entregas. Ainda pensa duas vezes antes de certas ruas.\n\nO sistema chama isso de "operação normal".`},ambiguous:{type:'RESISTÊNCIA COTIDIANA',title:'Saber é Uma Forma de Poder',text:`2024. Edu não mudou o sistema. Mas o sistema também não o mudou completamente.\n\nEle sabe mais do que sabia. Sabe o que as câmeras fazem, como os algoritmos operam.\n\nEsse conhecimento não paga conta. Mas também não pode ser tirado.\n\nContinua fazendo entregas. Mais consciente. Mais cansado. Ainda lá.`}}
}

// GAME STATE
// ════════════════════════════════════════
let S={screen:'splash',char:null,eraIdx:0,decIdx:0,scores:{ef:5,eq:5,pr:5},choices:[],lastChoice:null};
function reset(){S={screen:'splash',char:null,eraIdx:0,decIdx:0,scores:{ef:5,eq:5,pr:5},choices:[],lastChoice:null};}
function C(){return CHARS[S.char];}
function endKey(){const{ef,eq,pr}=S.scores;if(ef>=7&&pr<=4&&eq<=4)return'control';if(pr>=7&&eq>=7)return'human';if(ef<=4&&pr<=4&&eq<=4)return'collapse';return'ambiguous';}
function updateVis(){
  const{eq,pr}=S.scores,d=Math.max(0,Math.min(1,(10-(eq+pr)*.5)/10));
  document.documentElement.style.setProperty('--dystopia',d.toFixed(3));
  document.documentElement.style.setProperty('--char-col',S.char?C().color:'#3b82f6');
  const r=Math.round(7+d*18),g=Math.round(9+d*2);
  document.documentElement.style.setProperty('--bg',`rgb(${r},${g},15)`);
}

// HELPERS
// ════════════════════════════════════════
function scoreRows(col){
  const lb={ef:'Eficiência',eq:'Equidade',pr:'Privacidade'};
  return Object.entries(S.scores).map(([k,v])=>`<div class="score-row"><span class="score-label">${lb[k]}</span><div class="score-track"><div class="score-fill" style="width:${v*10}%;background:${col}"></div></div><span class="score-val">${v}/10</span></div>`).join('');
}
function tl(){return`<div class="timeline">${C().eras.map((e,i)=>`<div class="tl-item ${i<S.eraIdx?'tl-done':i===S.eraIdx?'tl-active':''}">${e.year.split('–')[0]}</div>`).join('')}</div>`;}
function cityFlags(){
  const f=[];
  if(CITY.cameras>=8)f.push({t:`📷 Vigilância alta (${CITY.cameras}/10)`,c:'active'});
  else if(CITY.cameras<=4)f.push({t:'Vigilância baixa',c:'good'});
  if(CITY.ibmContract==='full')f.push({t:'Contrato IBM — dados privados',c:'active'});
  if(CITY.ibmContract==='negotiated')f.push({t:'Dados parcialmente protegidos',c:'good'});
  if(CITY.reportStatus==='suppressed')f.push({t:'Relatório de viés — arquivado',c:'active'});
  if(CITY.reportStatus==='public')f.push({t:'Relatório de viés — público',c:'good'});
  if(CITY.schoolBiometrics===true)f.push({t:'Biometria em escolas',c:'active'});
  if(CITY.schoolBiometrics===false)f.push({t:'Biometria escolar bloqueada',c:'good'});
  if(CITY.rodrigoTemplate==='expansionist')f.push({t:'PPP sem licitação (38 cidades)',c:'active'});
  if(CITY.rodrigoTemplate==='controlled')f.push({t:'PPP controlada (12 cidades)',c:'good'});
  if(CITY.amaraPublished)f.push({t:'Pesquisa publicada',c:'good'});
  if(CITY.cpiDeponent)f.push({t:'CPI Vigilância ativa',c:'good'});
  if(CITY.rodrigoWhistle)f.push({t:'Ativistas rastreados — denunciado',c:'good'});
  if(!f.length)f.push({t:'Nenhuma decisão registrada ainda',c:'neutral'});
  return`<div class="city-flags">${f.map(x=>`<span class="city-flag city-flag-${x.c}">${x.t}</span>`).join('')}</div>`;
}

function renderSplash(){return`
<div class="screen" style="text-align:center">
  <div style="margin-bottom:1.5rem"><span class="status-dot"></span><span class="label">Sistema Iniciando</span></div>
  <div tabindex="-1" class="splash-title">CIDADE<br><em>ONLINE</em></div>
  <div class="splash-meta">Brasil · 2010–2040 · Um jogo de decisões</div>
  <div class="splash-tagline">Cidades inteligentes não são neutras.<br><strong>Inteligentes para quem?</strong></div>
  <button class="btn" data-a="charSelect" style="font-size:.9rem;padding:.9rem 2.5rem">▶  INICIAR SISTEMA</button>
  <div style="margin-top:.75rem"><button class="btn btn-ghost" data-a="resetCity" style="font-size:.65rem;padding:.4rem 1rem">⟳ Resetar estado da cidade</button></div>
  <div style="margin-top:3.5rem;font-size:.65rem;color:var(--text-dim);max-width:480px;line-height:2;text-align:center">
    4 personagens · Múltiplos finais · Decisões herdadas entre personagens<br>
    Baseado em eventos, contratos e pesquisas reais do Brasil (2010–2025)
  </div>
</div>`;}
 
function renderCharSelect(){
  const cs=Object.values(CHARS),allPlayed=cs.every(c=>CITY.playedChars.includes(c.id)),hasPlayed=CITY.playedChars.length>0;
  return`
<div class="screen">
  <div style="text-align:center;margin-bottom:1.25rem">
    <div class="label" style="margin-bottom:.4rem">Escolha seu personagem</div>
    <div tabindex="-1" class="display" style="font-size:1.4rem;color:var(--text-bright)">Por qual lente você vê a cidade?</div>
  </div>
  ${allPlayed?`<div style="text-align:center;margin-bottom:1.25rem"><button class="btn btn-finale" data-a="grandFinale">★ RELATÓRIO FINAL DA CIDADE</button></div>`:''}
  ${hasPlayed?`<div class="city-panel" style="max-width:980px"><div class="city-panel-title">Estado atual da cidade — herdado das suas escolhas</div>${cityFlags()}</div>`:''}
  <div class="char-grid">
  ${cs.map(c=>{const played=CITY.playedChars.includes(c.id);return`
    <div class="char-card${played?' played':''}" data-a="charIntro" data-char="${c.id}" style="--c-col:${c.color}">
      <div class="char-name">${c.name}</div>
      <div class="char-role" style="color:${c.color}">${c.role}</div>
      <div class="char-city">${c.city}</div>
      <div class="char-quote" style="border-color:${c.color};color:var(--text)">${c.quote}</div>
      <div class="char-lens">${c.lens}</div>
      ${c.id==='edu'?`<div style="margin-top:.7rem;font-size:.62rem;color:var(--amber);font-style:italic">* Edu experimenta as consequências das escolhas dos outros personagens</div>`:''}
    </div>`;}).join('')}
  </div>
  <div style="margin-top:1.5rem">
    ${!allPlayed?`<div style="font-size:.65rem;color:var(--text-dim);text-align:center;margin-bottom:1rem">Jogue com todos os 4 personagens para desbloquear o Relatório Final da Cidade</div>`:''}
    <div style="display:flex;gap:.75rem;justify-content:center"><button class="btn btn-ghost" data-a="splash">← Voltar</button></div>
  </div>
</div>`;}
 
function renderCharIntro(){
  const c=C();
  return`
<div class="screen">
  <div style="width:100%;max-width:720px">
    <div class="label label-accent" style="margin-bottom:.4rem">Personagem</div>
    <div tabindex="-1" class="display" style="font-size:clamp(1.8rem,6vw,3.2rem);color:var(--text-bright);margin-bottom:.2rem">${c.name}</div>

      <button class="btn" data-a="start" style="border-color:${c.color};color:${c.color}">COMEÇAR →</button>
      <button class="btn btn-ghost" data-a="charSelect">← Trocar personagem</button>
    </div>
  </div>
</div>`;}
 
function renderEra(){
  const c=C(),era=c.eras[S.eraIdx],dec=era.decisions[S.decIdx],add=cityAddendum(c.id,S.eraIdx);
  const tickerText=buildTickerText(c.id);
  return`
<div class="screen screen-left" style="--char-col:${c.color}">
  <div class="game-header">
    <div><div class="label label-accent">${c.name}</div><div class="label">${era.label} · ${era.year}</div></div>
    <div class="era-badge">${era.year}</div>
  </div>
  ${tl()}
  <div class="ticker-wrap">
    <div class="ticker-live">AO VIVO</div>
    <div class="ticker-scroll"><div class="ticker-inner">${tickerText}</div></div>
  </div>
  <div class="era-year">${era.year}</div>
  <div tabindex="-1" class="era-title">${era.title}</div>
  <div class="context-text">${era.context.replace(/\n\n/g,'<br><br>')}
    ${add?`<div class="context-addendum">⟳ ${add}</div>`:''}
  </div>
  <div class="decision-q">${dec.q}</div>
  <div class="choices">
    ${dec.choices.map((ch,i)=>`
    <button class="choice-btn" data-a="choose" data-idx="${i}">
      <div class="choice-letter">Opção ${String.fromCharCode(65+i)}</div>
      ${ch.text}
    </button>`).join('')}
  </div>
  <div class="spacer"></div>
</div>`;}
 
function renderConsequence(){
  const c=C(),era=c.eras[S.eraIdx],dec=era.decisions[S.decIdx],ch=dec.choices[S.lastChoice];
  const isLast=S.eraIdx>=c.eras.length-1;
  const nextBtn=isLast?`<button class="btn" data-a="ending" style="border-color:${c.color};color:${c.color}">VER DESFECHO FINAL →</button>`:`<button class="btn" data-a="nextEra" style="border-color:${c.color};color:${c.color}">PRÓXIMA ERA →</button>`;
  return`
<div class="screen screen-left" style="--char-col:${c.color}">
  <div class="game-header">
    <div><div class="label label-accent">${c.name}</div><div class="label">${era.year} · Consequência</div></div>
    <div class="label">Opção ${String.fromCharCode(65+S.lastChoice)}</div>
  </div>
  <div tabindex="-1" style="max-width:740px;width:100%;font-size:.78rem;color:var(--text-dim);font-style:italic;margin-bottom:.5rem">→ "${ch.text}"</div>
  <div class="consequence-box"><div class="consequence-label">O que acontece</div><div class="consequence-text">${ch.consequence}</div></div>
  <div class="reveal-box"><div class="reveal-label">Perspectiva crítica</div>${ch.reveal}</div>
  ${ch.hl?`<div class="manchetes">
    <div class="manchete manchete-mainstream"><div class="manchete-label">📰 Mídia convencional</div>${ch.hl.main}</div>
    <div class="manchete manchete-alt"><div class="manchete-label">📡 Mídia independente</div>${ch.hl.alt}</div>
  </div>`:''}
  <div class="scores-wrap"><div class="label" style="margin-bottom:.75rem">Estado atual — ${c.name}</div>${scoreRows(c.color)}</div>
  <div style="display:flex;gap:1rem;flex-wrap:wrap">${nextBtn}</div>
  <div class="spacer"></div>
</div>`;}
 
function renderEnding(){
  const c=C(),ek=endKey(),e=c.endings[ek];
  const ec={control:'#ef4444',human:'#10b981',collapse:'#64748b',ambiguous:'#f59e0b'}[ek];
  const allPlayed=Object.keys(CHARS).every(k=>CITY.playedChars.includes(k));
  return`
<div class="screen" style="--char-col:${ec}">
  <div class="ending-wrap">
    <div class="ending-type-badge" style="color:${ec};border-color:${ec}">${e.type}</div>
    <div tabindex="-1" class="ending-title">${e.title}</div>
    <div class="ending-text">${e.text.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}</div>
    <hr class="div">
    <div class="scores-wrap"><div class="label" style="margin-bottom:.75rem">Balanço Final — ${c.name}</div>${scoreRows(ec)}</div>
    <div style="margin:1rem 0"><div class="city-panel-title label" style="margin-bottom:.75rem">Impacto na cidade</div>${cityFlags()}</div>
    <div class="ending-stats">
      <div class="stat-block"><span class="stat-num" style="color:${ec}">${S.choices.length}</span><div class="stat-desc">Decisões</div></div>
      <div class="stat-block"><span class="stat-num" style="color:${ec}">${CITY.playedChars.length}/4</span><div class="stat-desc">Personagens</div></div>
      <div class="stat-block"><span class="stat-num" style="color:${ec}">4</span><div class="stat-desc">Finais possíveis</div></div>
    </div>
    ${allPlayed?`<div style="text-align:center;margin:1rem 0"><button class="btn btn-finale" data-a="grandFinale">★ VER RELATÓRIO FINAL DA CIDADE</button></div>`:'<div style="font-size:.65rem;color:var(--text-dim);text-align:center;margin:1rem 0">Jogue com todos os 4 personagens para desbloquear o Relatório Final</div>'}
    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.75rem">
      <button class="btn" data-a="charSelect" style="border-color:${ec};color:${ec}">JOGAR NOVAMENTE</button>
      <button class="btn btn-ghost" data-a="splash">INÍCIO</button>
    </div>
    <div class="footnote">Fontes: Data Privacy Brasil (2021) · CESeC & Lapin (2024) · O Panóptico/Lapin (2024) · Lab404/UFBA (2025) · O'Neil "Weapons of Math Destruction" (2016) · LGPD 13.709/2018 · Contratos de PPP municipal 2014–2024.</div>
  </div>
</div>`;}
 
function renderGrandFinale(){
  const ak=getCityArchetype(),arch=FINALE[ak],items=getAuditItems();
  return`
<div class="screen">
  <div style="max-width:740px;width:100%;text-align:center;margin-bottom:2rem">
    <div class="label" style="margin-bottom:.5rem">Relatório Final da Cidade</div>
    <div tabindex="-1" class="finale-header" style="color:${arch.color}">CIDADE<br>ONLINE</div>
    <div class="finale-sub">Balanço coletivo · Todos os personagens · Salvador, BA</div>
  </div>
  <div style="max-width:700px;width:100%">
    <div class="finale-archetype-badge" style="color:${arch.color};border-color:${arch.color}">${arch.archetype}</div>
    <div class="finale-title" style="color:var(--text-bright)">${arch.title}</div>
    <div class="finale-text" style="color:var(--text)">${arch.text.replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}</div>
    <hr class="div">
    <div class="city-meter">
      <div class="city-meter-title">Métricas acumuladas da cidade</div>
      ${[{l:'Nível de vigilância',v:CITY.cameras,c:'#ef4444'},{l:'Transparência contratual',v:CITY.transparency,c:'#3b82f6'},{l:'Equidade algorítmica',v:CITY.equity,c:'#10b981'}].map(m=>`
      <div class="meter-row">
        <div class="meter-label" style="font-size:.68rem">${m.l}</div>
        <div class="meter-track"><div class="meter-fill" style="width:${m.v*10}%;background:${m.c}"></div></div>
        <div class="meter-val" style="color:${m.c}">${m.v}/10</div>
      </div>`).join('')}
    </div>
    <div class="audit-list">
      <div class="audit-title">Histórico de decisões coletivas</div>
      ${items.map(it=>`
      <div class="audit-item ${it.bad===true?'audit-bad':it.bad===false?'audit-good':''}">
        <span class="audit-icon">${it.bad===true?'✕':it.bad===false?'✓':'·'}</span>
        <span>${it.text}</span>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:2rem">
      <button class="btn btn-ghost" data-a="charSelect">← JOGAR MAIS</button>
      <button class="btn btn-ghost" data-a="resetCity">⟳ RECOMEÇAR DO ZERO</button>
    </div>
    <div class="footnote">Este relatório reflete as decisões tomadas em todas as jornadas. Cada nova partida com os mesmos personagens pode alterar o estado da cidade e desbloquear um arquétipo diferente.</div>
  </div>
</div>`;}
 
// ════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════
const app=document.getElementById('app');
function render(){
  updateVis();
  const scr={splash:renderSplash,charSelect:renderCharSelect,charIntro:renderCharIntro,era:renderEra,consequence:renderConsequence,ending:renderEnding,grandFinale:renderGrandFinale};
  app.innerHTML=(scr[S.screen]||renderSplash)();
  app.scrollTop=0;
  
  // Acessibilidade: transfere o foco para o elemento principal de cada nova tela
  const title = app.querySelector('.splash-title, .display, .era-title, .ending-title, .finale-header');
  if(title) {
    title.style.outline = 'none'; // Impede o contorno de foco visual padrão para manter a estética
    title.focus();
  }
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='splash'){reset();render();return;}
  if(a==='resetCity'){resetCity();CITY=loadCity();reset();render();return;}
  if(a==='charSelect'){S.screen='charSelect';render();return;}
  if(a==='grandFinale'){S.screen='grandFinale';render();return;}
  if(a==='charIntro'){
    const ch=el.dataset.char;
    S={screen:'charIntro',char:ch,eraIdx:0,decIdx:0,scores:{ef:5,eq:5,pr:5},choices:[],lastChoice:null};
    render();return;
  }
  if(a==='start'){S.screen='era';render();return;}
  if(a==='choose'){
    const idx=parseInt(el.dataset.idx),ch=C().eras[S.eraIdx].decisions[S.decIdx].choices[idx];
    S.scores.ef=Math.max(1,Math.min(10,S.scores.ef+(ch.ef||0)));
    S.scores.eq=Math.max(1,Math.min(10,S.scores.eq+(ch.eq||0)));
    S.scores.pr=Math.max(1,Math.min(10,S.scores.pr+(ch.pr||0)));
    S.lastChoice=idx;S.choices.push(idx);
    applyImpact(ch.impact);
    if((ch.pr||0)<-1||(ch.eq||0)<-1){app.classList.add('glitch-anim');setTimeout(()=>app.classList.remove('glitch-anim'),400);}
    S.screen='consequence';render();return;
  }
  if(a==='nextEra'){S.eraIdx++;S.decIdx=0;S.screen='era';render();return;}
  if(a==='ending'){
    if(!CITY.playedChars.includes(S.char)){CITY.playedChars.push(S.char);saveCity(CITY);}
    S.screen='ending';render();return;
  }
});
render();
</script>
</body>
</html>
